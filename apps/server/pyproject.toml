[project]
name = "hqagent-remote-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141.1", "uvicorn", "websockets", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
