[project]
name = "hqagent-hub-core"
version = "0.1.0"
description = "HQAgent-Hub Local Hub core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  # 裸 uvicorn 不含 WebSocket 实现，缺它时 Upgrade 请求会退化成普通 HTTP，
  # 被 Bearer 中间件拦成 401，/api/v1/events/stream 完全不可用。
  # 测试套件发现不了：Starlette TestClient 在进程内自实现 WS，不走 uvicorn 这层。
  "websockets>=15,<18",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[project.scripts]
hqagent-core = "runtime.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "runtime", "storage"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages"]
testpaths = ["tests"]
addopts = "-ra"

