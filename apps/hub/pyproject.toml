[project]
name = "hqagent-hub-core"
version = "0.1.0"
description = "HQAgent-Hub Local Hub core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[project.scripts]
hqagent-core = "runtime.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "runtime", "storage"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages"]
testpaths = ["tests"]
addopts = "-ra"

