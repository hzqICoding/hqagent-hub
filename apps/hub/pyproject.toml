[project]
name = "hqagent-hub-core"
version = "0.1.0"
description = "HQAgent-Hub Local Hub core"
requires-python = ">=3.11"
dependencies = [
  # 协议包必须是真实依赖，不能靠 sys.path 碰巧能找到——
  # 后者只在源码检出且 packages/ 在路径上时成立，PyInstaller 打包时不成立。
  "hqagent-protocol",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  # 裸 uvicorn 不含 WebSocket 实现，缺它时 Upgrade 请求会退化成普通 HTTP，
  # 被 Bearer 中间件拦成 401，/api/v1/events/stream 完全不可用。
  # 测试套件发现不了：Starlette TestClient 在进程内自实现 WS，不走 uvicorn 这层。
  "websockets>=15,<18",
  "segno==1.6.6",
  "keyring==25.7.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[project.scripts]
hqagent-core = "runtime.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# adapters / orchestrator / security 是 W2 / W3 的独占目录，但它们要和 api/core 一起
# 进 wheel，否则 PyInstaller 打包时这三个包不进产物——W1 的 R1 就是这么炸的
# （见 .hqagent/reviews/INT-smoke-W1xW5.md）。两份 handoff 都点名要求 Integrator 加。
packages = ["adapters", "api", "core", "orchestrator", "runtime", "security", "storage"]

[tool.uv.sources]
hqagent-protocol = { path = "../../packages/protocol", editable = true }

[tool.pytest.ini_options]
# 故意不再把 ../../packages 加进来。加了的话测试会绕过安装直接走源码路径，
# 于是「协议包没装好」这种问题在测试里永远看不见——R1 就是这么藏了一整轮
# （见 .hqagent/reviews/INT-smoke-W1xW5.md）。现在必须先
# pip install -e packages/protocol 才能跑测试，这正是我们要的回归防线。
pythonpath = ["."]
# W2 / W3 的测试在各自独占目录里，不在 apps/hub/tests 下。不列进来的话
# `pytest` 只会跑 W1 自己那 17 条，另外 51 条在 CI 上等于不存在。
# 不要把它们搬进 apps/hub/tests——那是 W1 独占路径，会破坏路径所有权。
testpaths = ["tests", "adapters/tests", "orchestrator/tests", "security/tests"]
addopts = "-ra"
