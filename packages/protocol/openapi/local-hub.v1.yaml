                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '415':
          description: Local ApiEnvelope.error; ATTACHMENT_TYPE_UNSUPPORTED
