      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
            examples:
              request:
                summary: Synthetic 15-byte UTF-8 stream, not base64
                value: 'synthetic file

                  '
  /api/v1/attachments/{attachmentId}:
    get:
