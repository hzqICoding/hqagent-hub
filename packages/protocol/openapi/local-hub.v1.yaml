openapi: 3.1.0
info:
  title: HQAgent-Hub Local Hub API
  version: 0.10.0
  description: |
    Vue 与 Tauri 桌面壳的**唯一**网络契约（裁决 D1）。Update Agent 的内部 API 见
    `update-agent.internal.v1.yaml`，它不向 Vue 暴露第二个 Base URL、第二个 Token
    或第二条事件序列。

    **接入方式**：Hub 启动后把 `port` 与 `token` 写入
    `%LOCALAPPDATA%\HQAgent-Hub\runtime\hub.json`（结构见
    `schema/runtime-descriptor.json`）。桌面壳读取该文件并通过
    `invoke('get_hub_endpoint')` 交给前端。除 `GET /healthz` 外全部需要 Bearer。

    **WebSocket**：浏览器/WebView 的原生 WebSocket 无法自定义 Authorization 头，
    因此先用 Bearer 调 `POST /api/v1/auth/ws-ticket` 换 30 秒一次性 Ticket，
    再以查询参数握手。Ticket 用过即废、过期即废、重放必失败。

    **幂等**：所有写请求接受 `Idempotency-Key` 头。相同 Key + 相同请求体重放
    只产生一次副作用；相同 Key + 不同请求体返回 `IDEMPOTENCY_MISMATCH`。

servers:
  - url: http://127.0.0.1:{port}
    description: 仅监听回环地址，端口每次启动随机
    variables:
      port:
        default: "0"

security:
  - bearerAuth: []

tags:
  - name: system
  - name: agents
  - name: workspaces
  - name: team-profiles
  - name: tasks
  - name: sessions
  - name: approvals
  - name: settings
  - name: updates
  - name: events
  - name: internal

paths:
  /api/v1/attachments/{attachmentId}/thumbnail:
    get:
      operationId: getLocalAttachmentThumbnailV1
      summary: 仅服务端重编码PNG缩略图，图片首帧且去元数据；非图片或生成失败409 THUMBNAIL_UNAVAILABLE，pending409 NOT_READY；不回退原文件
      description: 仅代理已同步附件的服务端生成PNG缩略图，映射本机ID到既有服务器引用并以设备凭据请求variant=thumbnail；未配对/离线/尚未上传或生成失败返回ATTACHMENT_THUMBNAIL_UNAVAILABLE，不返回原始图片。响应attachment/nosniff/no-store。
      security:
      - bearerAuth: []
      x-auth-mode: local
      parameters:
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
        example: attachment_demo
      responses:
        '200':
          description: Authenticated streaming bytes, not ApiEnvelope; errors before streaming use JSON error envelope. No
            range support in this release.
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                pattern: ^attachment;
              example: attachment; filename="preview.png"
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Content-Length:
              schema:
                type: integer
                minimum: 1
          content:
            image/png:
              schema:
                type: string
                format: binary
              example: <synthetic PNG bytes>
        '409':
          description: Local ApiEnvelope.error; UNAUTHORIZED, NOT_FOUND, ATTACHMENT_NOT_READY, ATTACHMENT_THUMBNAIL_UNAVAILABLE
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '404':
          description: Local ApiEnvelope.error; UNAUTHORIZED, NOT_FOUND, ATTACHMENT_NOT_READY, ATTACHMENT_THUMBNAIL_UNAVAILABLE
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '401':
          description: Local ApiEnvelope.error; UNAUTHORIZED, NOT_FOUND, ATTACHMENT_NOT_READY, ATTACHMENT_THUMBNAIL_UNAVAILABLE
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
      x-error-codes:
      - UNAUTHORIZED
      - NOT_FOUND
      - ATTACHMENT_NOT_READY
      - ATTACHMENT_THUMBNAIL_UNAVAILABLE
      x-binary-download: true
  /api/v1/attachments/limits:
    get:
      operationId: localGetAttachmentLimitsV1
      summary: 读取固定上传限制与本账号逻辑已用/预留配额；不查询文件正文
      description: 本机受控附件库：Cookie/Bearer及本机Origin、幂等保护；不依赖配对/暂停/sync开关，cloud账号配额仅在同步上传时核算；本机沿单文件/数量白名单限制。文件不执行，ID替代路径。缩略图不在本机生成；thumbnail仅代理服务端生成结果，未同步时只显示图标。
      security:
      - bearerAuth: []
      x-auth-mode: local
      parameters:
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                success:
                  value:
                    success: true
                    data:
                      imageMaxBytes: 10000000
                      fileMaxBytes: 20000000
                      messageMaxCount: 5
                      accountQuotaBytes: 5000000000
                      unattachedTtlSeconds: 86400
                      imageMimeTypes:
                      - image/jpeg
                      - image/png
                      - image/webp
                      - image/gif
                      fileExtensions:
                      - .pdf
                      - .txt
                      - .md
                      - .json
                      - .c
                      - .h
                      - .cpp
                      - .hpp
                      - .cc
                      - .cxx
                      - .py
                      - .js
                      - .ts
                      - .jsx
                      - .tsx
                      - .java
                      - .kt
                      - .kts
                      - .go
                      - .rs
                      - .swift
                      - .m
                      - .mm
                      - .cs
                      - .rb
                      - .php
                      - .sh
                      - .ps1
                      - .sql
                      - .yaml
                      - .yml
                      - .toml
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.10.0
          x-dataSchema:
            $ref: ../schema/remote-attachments.json#/$defs/AttachmentLimits
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: Local ApiEnvelope.error; BAD_REQUEST
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '500':
          description: Local ApiEnvelope.error; INTERNAL
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
