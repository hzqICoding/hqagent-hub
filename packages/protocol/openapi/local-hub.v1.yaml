openapi: 3.1.0
info:
  title: HQAgent-Hub Local Hub API
  version: 0.2.2
  description: |
    Vue 与 Tauri 桌面壳的**唯一**网络契约（裁决 D1）。Update Agent 的内部 API 见
    `update-agent.internal.v1.yaml`，它不向 Vue 暴露第二个 Base URL、第二个 Token
    或第二条事件序列。

    **接入方式**：Hub 启动后把 `port` 与 `token` 写入
    `%LOCALAPPDATA%\HQAgent-Hub\runtime\hub.json`（结构见
    `schema/runtime-descriptor.json`）。桌面壳读取该文件并通过
    `invoke('get_hub_endpoint')` 交给前端。除 `GET /healthz` 外全部需要 Bearer。

    **WebSocket**：浏览器/WebView 的原生 WebSocket 无法自定义 Authorization 头，
    因此先用 Bearer 调 `POST /api/v1/auth/ws-ticket` 换 30 秒一次性 Ticket，
    再以查询参数握手。Ticket 用过即废、过期即废、重放必失败。

    **幂等**：所有写请求接受 `Idempotency-Key` 头。相同 Key + 相同请求体重放
    只产生一次副作用；相同 Key + 不同请求体返回 `IDEMPOTENCY_MISMATCH`。

servers:
  - url: http://127.0.0.1:{port}
    description: 仅监听回环地址，端口每次启动随机
    variables:
      port:
        default: "0"

security:
  - bearerAuth: []

tags:
  - name: system
  - name: agents
  - name: workspaces
  - name: team-profiles
  - name: tasks
  - name: sessions
  - name: approvals
  - name: settings
  - name: updates
  - name: events
  - name: internal

paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探测（唯一免鉴权端点）
      description: |
        Update Plan v2 的 healthChecks 需要在没有 Token 的情况下探活，因此本端点免鉴权。
        只返回非敏感信息，绝不返回 token、路径或任务内容。
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "../schema/envelope.json#/$defs/HealthView"

  /api/v1/bootstrap:
    get:
      tags: [system]
      summary: 首屏聚合
      responses:
        "200":
          $ref: "#/components/responses/Bootstrap"

  /api/v1/auth/ws-ticket:
    post:
      tags: [system]
      summary: 用 Bearer 换取一次性 WebSocket Ticket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../schema/runtime-descriptor.json#/$defs/WsTicketRequest"
      responses:
        "200":
          $ref: "#/components/responses/WsTicket"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/agents:
    get:
      tags: [agents]
      summary: 列出已登记的 Agent 实例
      responses:
        "200":
          $ref: "#/components/responses/AgentList"

  /api/v1/agents/discovery:
    post:
      tags: [agents]
      summary: 触发一次 Agent 探测
      responses:
        "200":
          $ref: "#/components/responses/AgentDiscovery"

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: 列出工作区
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceList"
    post:
      tags: [workspaces]
      summary: 添加受管工作区
      description: >-
        Hub 自行探测路径是不是 Git 仓库并写入 vcs，不接受调用方声明。
        非 Git 目录也可以添加，但 capabilities.canRunWriteTasks 为 false（裁决 D38）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/workspace.json#/$defs/AddWorkspaceInput"
      responses:
        "200":
          $ref: "#/components/responses/Workspace"

  /api/v1/workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [workspaces]
      summary: 移除受管工作区
      description: 只解除 Hub 的管理关系，不删除磁盘上的任何文件。
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/workspaces/{id}/init-git:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      summary: 把工作区初始化为 Git 仓库
      description: >-
        裁决 D38 的 C 项：非 Git 工作区不能派写任务，这里提供一键补救。
        已经是 Git 仓库时原样返回，不报错。
      responses:
        "200":
          $ref: "#/components/responses/Workspace"

  /api/v1/workspaces/{id}/init-memory:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      summary: 初始化 .hqagent 共享记忆目录
      responses:
        "200":
          $ref: "#/components/responses/Workspace"

  /api/v1/team-profiles:
    get:
      tags: [team-profiles]
      summary: 列出 Team Profile
      responses:
        "200":
          $ref: "#/components/responses/TeamProfileList"

  /api/v1/team-profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [team-profiles]
      summary: 读取单个 Team Profile
      responses:
        "200":
          $ref: "#/components/responses/TeamProfile"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [team-profiles]
      summary: 保存 Team Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/team-profile.json#/$defs/SaveTeamProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/TeamProfile"

  /api/v1/team-profiles/resolve:
    post:
      tags: [team-profiles]
      summary: 解析角色到具体 Agent（含降级原因与能力缺口）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/team-profile.json#/$defs/ResolveTeamProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/ResolvedTeam"

  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: 分页列出任务
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, schema: { $ref: "../schema/common.json#/$defs/TaskStatus" } }
        - { name: workspaceId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/TaskPage"
    post:
      tags: [tasks]
      summary: 创建任务
      description: |
        Hub 处于维护/排空状态时本接口返回 `HUB_MAINTENANCE`，前端据此显示全局 Gate，
        不要靠前端自己猜测能否创建。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/task.json#/$defs/CreateTaskInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: 任务详情
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"

  /api/v1/tasks/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: 暂停 / 继续 / 取消 / 重试 / 追加指令
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/task.json#/$defs/TaskActionInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 分页列出会话
      parameters:
        - { name: workspaceId, in: query, schema: { type: string } }
        - { name: taskId, in: query, schema: { type: string } }
        - { name: onlyValid, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          $ref: "#/components/responses/SessionPage"

  /api/v1/sessions/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: 显式恢复会话
      description: |
        恢复会话必须是显式动作（裁决 D7）。新任务默认新会话，本接口只用于用户
        明确点了「继续这个会话」的场景。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/session.json#/$defs/ResumeSessionInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: 列出审批
      parameters:
        - { name: status, in: query, schema: { $ref: "../schema/common.json#/$defs/ApprovalStatus" } }
        - { name: taskId, in: query, schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/ApprovalList"

  /api/v1/approvals/{id}/response:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [approvals]
      summary: 批准或拒绝
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/approval.json#/$defs/ApprovalResponseInput"
      responses:
        "200":
          $ref: "#/components/responses/Approval"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/settings:
    get:
      tags: [settings]
      summary: 读取设置
      responses:
        "200":
          $ref: "#/components/responses/UserSettings"

  /api/v1/settings/appearance:
    put:
      tags: [settings]
      summary: 更新外观设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/settings.json#/$defs/AppearanceSettings"
      responses:
        "200":
          $ref: "#/components/responses/Appearance"

  # ---- 升级：9 条细路径，由 Local Hub 代理到 Update Agent（裁决 D1）----
  /api/v1/updates/state:
    get:
      tags: [updates]
      summary: 当前升级状态
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/check:
    post:
      tags: [updates]
      summary: 检查更新
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/download:
    post:
      tags: [updates]
      summary: 开始或续传下载
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/cancel:
    post:
      tags: [updates]
      summary: 取消下载
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/install:
    post:
      tags: [updates]
      summary: 请求安装（先排空任务）
      description: |
        存在运行任务时进入 `draining_tasks` 而不是直接安装。排空超时进入
        `waiting_user`，由用户选择继续等待、取消任务或退出应用。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../schema/update-state.json#/$defs/UpdateActionInput"
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/defer:
    post:
      tags: [updates]
      summary: 稍后提醒
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/update-state.json#/$defs/UpdateActionInput"
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/releases:
    get:
      tags: [updates]
      summary: 可用版本列表
      responses:
        "200":
          $ref: "#/components/responses/ReleaseList"
  /api/v1/updates/result:
    get:
      tags: [updates]
      summary: 上次升级回执
      responses:
        "200":
          $ref: "#/components/responses/UpdateResult"
  /api/v1/updates/result/acknowledge:
    post:
      tags: [updates]
      summary: 确认升级回执
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../schema/update-result.json#/$defs/AcknowledgeUpdateResultInput"
      responses:
        "200":
          $ref: "#/components/responses/UpdateResult"

  # ---- 事件 ----
  /api/v1/events:
    get:
      tags: [events]
      summary: 按 seq 补发历史事件
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
          description: 客户端最后确认的 seq，返回 (after, now] 区间
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          $ref: "#/components/responses/EventPage"

  /api/v1/events/stream:
    get:
      tags: [events]
      summary: WebSocket 事件流（Ticket 鉴权）
      description: |
        这是 WebSocket 升级端点，不是普通 GET。握手时校验 `ticket` 有效、未过期、
        未使用过，校验通过后立即作废该 Ticket。可选 `after` 用于握手后补发。
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "101":
          description: 切换协议成功，后续帧为 HubEvent
        "401":
          $ref: "#/components/responses/Error"

  # ---- 内部：仅供 Update Agent 与桌面壳调用，不生成给 Vue ----
  /internal/maintenance:
    post:
      tags: [internal]
      summary: 进入或退出维护模式
      responses:
        "200":
          description: OK
  /internal/drain/state:
    get:
      tags: [internal]
      summary: 排空状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "../schema/update-state.json#/$defs/DrainProgress"
  /internal/drain/start:
    post:
      tags: [internal]
      summary: 开始排空（停止接收新任务 → 保存会话 → 等待任务 → 备份 → 就绪）
      responses:
        "200":
          description: OK
  /internal/backup/database:
    post:
      tags: [internal]
      summary: WAL checkpoint + SQLite Backup，供升级前调用（裁决 D6）
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token 来自 hub.json，每次 Hub 启动轮换

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: 相同 Key + 相同请求体重放只产生一次副作用

  responses:
    Error:
      description: 统一错误包络
      content:
        application/json:
          schema:
            $ref: "../schema/envelope.json#/$defs/ApiEnvelope"
    Bootstrap:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/bootstrap.json#/$defs/BootstrapView"
    WsTicket:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/runtime-descriptor.json#/$defs/WsTicket"
    AgentList:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schema/agent-instance.json#/$defs/AgentView"
    AgentDiscovery:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/agent-instance.json#/$defs/AgentDiscoveryResult"
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/envelope.json#/$defs/ApiEnvelope"
    Workspace:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/workspace.json#/$defs/WorkspaceView"
    WorkspaceList:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schema/workspace.json#/$defs/WorkspaceView"
    TeamProfileList:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schema/team-profile.json#/$defs/TeamProfileView"
    TeamProfile:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/team-profile.json#/$defs/TeamProfileView"
    ResolvedTeam:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/team-profile.json#/$defs/ResolvedTeamView"
    TaskPage:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/envelope.json#/$defs/PageResult"
    TaskDetail:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/task.json#/$defs/TaskDetailView"
    SessionPage:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/envelope.json#/$defs/PageResult"
    ApprovalList:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schema/approval.json#/$defs/ApprovalView"
    Approval:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/approval.json#/$defs/ApprovalView"
    UserSettings:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/settings.json#/$defs/UserSettingsView"
    Appearance:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/settings.json#/$defs/AppearanceSettings"
    UpdateState:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/update-state.json#/$defs/UpdateStateView"
    UpdateResult:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/update-result.json#/$defs/UpdateResultView"
    ReleaseList:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schema/update-state.json#/$defs/ReleaseInfo"
    EventPage:
      description: OK
      content:
        application/json:
          schema:
            $ref: "../schema/envelope.json#/$defs/EventPage"
