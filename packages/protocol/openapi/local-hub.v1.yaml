              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
      x-error-codes:
      - BAD_REQUEST
      - INTERNAL
      - NOT_FOUND
      - VALIDATION_FAILED
      - UNAUTHORIZED
      - ORIGIN_NOT_ALLOWED
  /api/v1/conversations/{conversationId}/attachments:
    post:
      operationId: localUploadAttachmentV1
      summary: 浏览器raw body流式上传
      description: 本机受控附件库：Cookie/Bearer及本机Origin、幂等保护；不依赖配对/暂停/sync开关，cloud账号配额仅在同步上传时核算；本机沿单文件/数量白名单限制。文件不执行，ID替代路径。缩略图不在本机生成；thumbnail仅代理服务端生成结果，未同步时只显示图标。
        同一对话已存在附件方可随本机消息提交。
      security:
      - bearerAuth: []
      x-auth-mode: local
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: request-example-001
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Cookie/登录写请求必须等于部署Origin；PAT请求不检查Origin。
        x-required-for-security:
        - remoteSession
        example: https://hub.example.invalid
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
        example: conversation_demo
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 20000000
        example: 15
      - name: X-File-Name
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
        example: example.txt
      - name: X-Content-Sha256
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
        example: e2dbfe68423abd2a4aae75a697a9f47ef0298a44f8b40def76f878ee228a9e8d
      responses:
        '201':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                success:
                  value:
                    success: true
                    data:
                      attachment:
                        attachmentId: attachment_demo
                        fileName: example.txt
                        kind: file
                        mimeType: text/plain
                        sizeBytes: 15
                        sha256: e2dbfe68423abd2a4aae75a697a9f47ef0298a44f8b40def76f878ee228a9e8d
                      conversationId: conversation_demo
                      state: uploaded
                      createdAt: '2026-09-30T12:00:00Z'
                      expiresAt: '2026-10-01T12:00:00Z'
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.10.0
          x-dataSchema:
            $ref: ../schema/remote-attachments.json#/$defs/LocalAttachmentView
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          description: Local ApiEnvelope.error; ATTACHMENT_HASH_MISMATCH, VALIDATION_FAILED
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '409':
          description: Local ApiEnvelope.error; IDEMPOTENCY_MISMATCH
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
