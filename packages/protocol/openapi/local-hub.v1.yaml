          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '401':
          description: Local ApiEnvelope.error; UNAUTHORIZED
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
