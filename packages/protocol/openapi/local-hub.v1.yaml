openapi: 3.1.0
info:
  title: HQAgent-Hub Local Hub API
  version: 0.7.0
  description: |
    Vue 与 Tauri 桌面壳的**唯一**网络契约（裁决 D1）。Update Agent 的内部 API 见
    `update-agent.internal.v1.yaml`，它不向 Vue 暴露第二个 Base URL、第二个 Token
    或第二条事件序列。

    **接入方式**：Hub 启动后把 `port` 与 `token` 写入
    `%LOCALAPPDATA%\HQAgent-Hub\runtime\hub.json`（结构见
    `schema/runtime-descriptor.json`）。桌面壳读取该文件并通过
    `invoke('get_hub_endpoint')` 交给前端。除 `GET /healthz` 外全部需要 Bearer。

    **WebSocket**：浏览器/WebView 的原生 WebSocket 无法自定义 Authorization 头，
    因此先用 Bearer 调 `POST /api/v1/auth/ws-ticket` 换 30 秒一次性 Ticket，
    再以查询参数握手。Ticket 用过即废、过期即废、重放必失败。

    **幂等**：所有写请求接受 `Idempotency-Key` 头。相同 Key + 相同请求体重放
    只产生一次副作用；相同 Key + 不同请求体返回 `IDEMPOTENCY_MISMATCH`。

servers:
  - url: http://127.0.0.1:{port}
    description: 仅监听回环地址，端口每次启动随机
    variables:
      port:
        default: "0"

security:
  - bearerAuth: []

tags:
  - name: system
  - name: agents
  - name: workspaces
  - name: team-profiles
  - name: tasks
  - name: sessions
  - name: approvals
  - name: settings
  - name: updates
  - name: events
  - name: internal

paths:
  /api/v1/conversations/{conversationId}:
    patch:
      operationId: updateLocalConversationV1
      description: Worker-owned conversation metadata; title/archived/visibility with expectedVersion CAS and
        at least one mutation. Local and remote authority are both writable. Workspace/scene/session associations
        remain unchanged. Archive requires no queued/running/waiting_approval round; recovery-only rounds show
        warning, not a busy lock.
      security:
      - bearerAuth: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/UpdateLocalConversationInput
      responses:
        '200':
          description: Updated conversation; version increments for a successful metadata edit. lastRunStatus
            reflects latest actual run/task state and is absent if no runs exist.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConversationView
        '409':
          description: Version mismatch or conversation has unfinished work; ApiEnvelope error CONFLICT. Same
            key with different input yields IDEMPOTENCY_MISMATCH.
        '422':
          description: Empty patch, null field or invalid/blank title; ApiEnvelope error VALIDATION_FAILED.
  /api/v1/conversations:
    get:
      operationId: listLocalConversationsV1
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error envelope is shared with
            v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalConversationView
      parameters:
      - name: includeHidden
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      description: Computer list excludes mobile_only by default. includeHidden=true recovers hidden rows for
        editing; visibility is display-only. authority is not a write gate; busy is derived from actual kernel
        state.
  /api/v1/remote/sync-settings:
    get:
      operationId: getSyncSettingsV1
      security: &id001
      - bearerAuth: []
      description: Computer-owned persisted sync setting; missing configuration initializes mirrorEnabled=true.
        Visibility never disables upload.
      responses:
        '200':
          description: 'ApiEnvelope.data; Cache-Control: no-store.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-sync.json#/$defs/RemoteSyncSettingsView
    put:
      operationId: setSyncSettingsV1
      security: *id001
      description: Same manager for v1/v2. expectedVersion CAS, Idempotency-Key replay. Persist setting and reset/tombstone
        intent atomically; do not claim server deletion is already confirmed. Disabling deletes store copies
        when reset is delivered.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote-sync.json#/$defs/RemoteSyncSettingsInput
      responses:
        '200':
          description: 'ApiEnvelope.data; Cache-Control: no-store.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-sync.json#/$defs/RemoteSyncSettingsView
        default:
          description: Existing ApiEnvelope error; no-store.
  # ---- FZ-R1.1: local remote-link controls (existing v1 Bearer boundary) ----
  /api/v1/remote/link:
    get:
      tags: [system]
      operationId: getRemoteLink
      summary: 读取本机远程绑定与连接状态
      description: 只读本机状态，不启动模型或泄露设备凭据。沿用顶层bearerAuth、Host/Origin规则。
      responses:
        "200":
          description: ApiEnvelope.data为RemoteLinkView；Cache-Control:no-store。
          content:
            application/json:
              schema:
                $ref: "../schema/envelope.json#/$defs/ApiEnvelope"
          x-dataSchema:
            $ref: "../schema/remote-link.json#/$defs/RemoteLinkView"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/remote/pairing:
    post:
      tags: [system]
      operationId: startRemotePairing
      summary: 在本机发起远程设备配对
      description: |
        输入仅serverOrigin/deviceName，由Worker内部生成和保存设备secret。
        只有取得有效服务端短码才返回state=pairing。已在配对时不同请求返回REMOTE_PAIRING_IN_PROGRESS，
        paired/revoked/frozen须先显式unlink，返回REMOTE_PAIRING_CONFLICT，不覆盖旧凭据。
        serverOrigin校验失败为REMOTE_SERVER_ORIGIN_INVALID；服务端无法连接/响应未确认为REMOTE_SERVER_UNREACHABLE。
        幂等重放不新建secret/请求、不续期短码；所有写入沿用v1鉴权及Host/Origin规则。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/remote-link.json#/$defs/RemoteLinkPairingInput"
      responses:
        "200":
          description: ApiEnvelope.data为RemoteLinkView，成功发起时state=pairing；Cache-Control:no-store。
          content:
            application/json:
              schema:
                $ref: "../schema/envelope.json#/$defs/ApiEnvelope"
          x-dataSchema:
            $ref: "../schema/remote-link.json#/$defs/RemoteLinkView"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    delete:
      tags: [system]
      operationId: cancelRemotePairing
      summary: 取消本机进行中的配对
      description: |
        取消当前候选配对、轮询和候选凭据，成功返回unpaired。已经unpaired时幂等成功；
        已paired/revoked/frozen不得当作取消配对，须调用unlink，否则REMOTE_PAIRING_CONFLICT。
        取消前已发送的服务端请求可能仍生效，迟到结果不得复活本机绑定；未通知成功不宣称服务端也已撤销。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: ApiEnvelope.data为RemoteLinkView，state=unpaired；不再返回短码。
          content:
            application/json:
              schema:
                $ref: "../schema/envelope.json#/$defs/ApiEnvelope"
          x-dataSchema:
            $ref: "../schema/remote-link.json#/$defs/RemoteLinkView"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/remote/unlink:
    post:
      tags: [system]
      operationId: unlinkRemote
      summary: 本机删除远程设备凭据并断开绑定
      description: |
        完成本机断开和凭据删除后才返回state=unpaired，通知服务端撤销为best-effort，不能冒充服务端已确认。
        不把设备Bearer当浏览器Cookie调用远程owner撤销接口；缺乏可用授权通知途径或离线也不阻塞本机解绑，
        可通过unpaired.lastErrorCode报告REMOTE_AUTH_REQUIRED或REMOTE_SERVER_UNREACHABLE。
        凭据删除失败不得返回成功。既有remote对话authority保留历史来源，本机可继续，不自动重放消息。
        本操作不承诺取消已在运行的任务。所有写操作使用v1既有鉴权，不新增凭据。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: ApiEnvelope.data为RemoteLinkView，state=unpaired；仅保证本机已断开并清理凭据。
          content:
            application/json:
              schema:
                $ref: "../schema/envelope.json#/$defs/ApiEnvelope"
          x-dataSchema:
            $ref: "../schema/remote-link.json#/$defs/RemoteLinkView"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /healthz:
    get:
      tags: [system]
      summary: 存活探测（唯一免鉴权端点）
      description: |
        Update Plan v2 的 healthChecks 需要在没有 Token 的情况下探活，因此本端点免鉴权。
        只返回非敏感信息，绝不返回 token、路径或任务内容。
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "../schema/envelope.json#/$defs/HealthView"

  /api/v1/bootstrap:
    get:
      tags: [system]
      summary: 首屏聚合
      responses:
        "200":
          $ref: "#/components/responses/Bootstrap"

  /api/v1/auth/ws-ticket:
    post:
      tags: [system]
      summary: 用 Bearer 换取一次性 WebSocket Ticket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../schema/runtime-descriptor.json#/$defs/WsTicketRequest"
      responses:
        "200":
          $ref: "#/components/responses/WsTicket"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/agents:
    get:
      tags: [agents]
      summary: 列出已登记的 Agent 实例
      responses:
        "200":
          $ref: "#/components/responses/AgentList"

  /api/v1/agents/discovery:
    post:
      tags: [agents]
      summary: 触发一次 Agent 探测
      responses:
        "200":
          $ref: "#/components/responses/AgentDiscovery"

  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: 列出工作区
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceList"
    post:
      tags: [workspaces]
      summary: 添加受管工作区
      description: >-
        Hub 自行探测路径是不是 Git 仓库并写入 vcs，不接受调用方声明。
        非 Git 目录也可以添加，但 capabilities.canRunWriteTasks 为 false（裁决 D38）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/workspace.json#/$defs/AddWorkspaceInput"
      responses:
        "200":
          $ref: "#/components/responses/Workspace"

  /api/v1/workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [workspaces]
      summary: 移除受管工作区
      description: 只解除 Hub 的管理关系，不删除磁盘上的任何文件。
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /api/v1/workspaces/{id}/init-git:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      summary: 把工作区初始化为 Git 仓库
      description: >-
        裁决 D38 的 C 项：非 Git 工作区不能派写任务，这里提供一键补救。
        已经是 Git 仓库时原样返回，不报错。
      responses:
        "200":
          $ref: "#/components/responses/Workspace"

  /api/v1/workspaces/{id}/init-memory:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [workspaces]
      summary: 初始化 .hqagent 共享记忆目录
      responses:
        "200":
          $ref: "#/components/responses/Workspace"

  /api/v1/team-profiles:
    get:
      tags: [team-profiles]
      summary: 列出 Team Profile
      responses:
        "200":
          $ref: "#/components/responses/TeamProfileList"

  /api/v1/team-profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [team-profiles]
      summary: 读取单个 Team Profile
      responses:
        "200":
          $ref: "#/components/responses/TeamProfile"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [team-profiles]
      summary: 保存 Team Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/team-profile.json#/$defs/SaveTeamProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/TeamProfile"

  /api/v1/team-profiles/resolve:
    post:
      tags: [team-profiles]
      summary: 解析角色到具体 Agent（含降级原因与能力缺口）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/team-profile.json#/$defs/ResolveTeamProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/ResolvedTeam"

  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: 分页列出任务
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: status, in: query, schema: { $ref: "../schema/common.json#/$defs/TaskStatus" } }
        - { name: workspaceId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/TaskPage"
    post:
      tags: [tasks]
      summary: 创建任务
      description: |
        Hub 处于维护/排空状态时本接口返回 `HUB_MAINTENANCE`，前端据此显示全局 Gate，
        不要靠前端自己猜测能否创建。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/task.json#/$defs/CreateTaskInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [tasks]
      summary: 任务详情
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"

  /api/v1/tasks/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [tasks]
      summary: 暂停 / 继续 / 取消 / 重试 / 追加指令
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/task.json#/$defs/TaskActionInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 分页列出会话
      parameters:
        - { name: workspaceId, in: query, schema: { type: string } }
        - { name: taskId, in: query, schema: { type: string } }
        - { name: onlyValid, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          $ref: "#/components/responses/SessionPage"

  /api/v1/sessions/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [sessions]
      summary: 显式恢复会话
      description: |
        恢复会话必须是显式动作（裁决 D7）。新任务默认新会话，本接口只用于用户
        明确点了「继续这个会话」的场景。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/session.json#/$defs/ResumeSessionInput"
      responses:
        "200":
          $ref: "#/components/responses/TaskDetail"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: 列出审批
      parameters:
        - { name: status, in: query, schema: { $ref: "../schema/common.json#/$defs/ApprovalStatus" } }
        - { name: taskId, in: query, schema: { type: string } }
      responses:
        "200":
          $ref: "#/components/responses/ApprovalList"

  /api/v1/approvals/{id}/response:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [approvals]
      summary: 批准或拒绝
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/approval.json#/$defs/ApprovalResponseInput"
      responses:
        "200":
          $ref: "#/components/responses/Approval"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/settings:
    get:
      tags: [settings]
      summary: 读取设置
      responses:
        "200":
          $ref: "#/components/responses/UserSettings"

  /api/v1/settings/appearance:
    put:
      tags: [settings]
      summary: 更新外观设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/settings.json#/$defs/AppearanceSettings"
      responses:
        "200":
          $ref: "#/components/responses/Appearance"

  # ---- 升级：9 条细路径，由 Local Hub 代理到 Update Agent（裁决 D1）----
  /api/v1/updates/state:
    get:
      tags: [updates]
      summary: 当前升级状态
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/check:
    post:
      tags: [updates]
      summary: 检查更新
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/download:
    post:
      tags: [updates]
      summary: 开始或续传下载
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/cancel:
    post:
      tags: [updates]
      summary: 取消下载
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/install:
    post:
      tags: [updates]
      summary: 请求安装（先排空任务）
      description: |
        存在运行任务时进入 `draining_tasks` 而不是直接安装。排空超时进入
        `waiting_user`，由用户选择继续等待、取消任务或退出应用。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../schema/update-state.json#/$defs/UpdateActionInput"
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/defer:
    post:
      tags: [updates]
      summary: 稍后提醒
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/update-state.json#/$defs/UpdateActionInput"
      responses:
        "200":
          $ref: "#/components/responses/UpdateState"
  /api/v1/updates/releases:
    get:
      tags: [updates]
      summary: 可用版本列表
      responses:
        "200":
          $ref: "#/components/responses/ReleaseList"
  /api/v1/updates/result:
    get:
      tags: [updates]
      summary: 上次升级回执
      responses:
        "200":
          $ref: "#/components/responses/UpdateResult"
  /api/v1/updates/result/acknowledge:
    post:
      tags: [updates]
      summary: 确认升级回执
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../schema/update-result.json#/$defs/AcknowledgeUpdateResultInput"
      responses:
        "200":
          $ref: "#/components/responses/UpdateResult"

  # ---- 事件 ----
  /api/v1/events:
    get:
      tags: [events]
      summary: 按 seq 补发历史事件
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
          description: 客户端最后确认的 seq，返回 (after, now] 区间
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          $ref: "#/components/responses/EventPage"

  /api/v1/events/stream:
    get:
      tags: [events]
      summary: WebSocket 事件流（Ticket 鉴权）
      description: |
        这是 WebSocket 升级端点，不是普通 GET。握手时校验 `ticket` 有效、未过期、
        未使用过，校验通过后立即作废该 Ticket。可选 `after` 用于握手后补发。
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "101":
          description: 切换协议成功，后续帧为 HubEvent
        "401":
          $ref: "#/components/responses/Error"

  # ---- 内部：仅供 Update Agent 与桌面壳调用，不生成给 Vue ----
  /internal/maintenance:
    post:
      tags: [internal]
      summary: 进入或退出维护模式
      responses:
        "200":
          description: OK
  /internal/drain/state:
    get:
      tags: [internal]
      summary: 排空状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "../schema/update-state.json#/$defs/DrainProgress"
  /internal/drain/start:
    post:
      tags: [internal]
      summary: 开始排空（停止接收新任务 → 保存会话 → 等待任务 → 备份 → 就绪）
      responses:
        "200":
          description: OK
  /internal/backup/database:
    post:
      tags: [internal]
      summary: WAL checkpoint + SQLite Backup，供升级前调用（裁决 D6）
      responses:
        "200":
          description: OK

