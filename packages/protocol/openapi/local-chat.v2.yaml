openapi: 3.1.0
info:
  title: HQAgent N0 Local Chat
  version: 0.7.0
  description: N0 additive contract. Responses use the existing ApiEnvelope; response
    schema below describes data, see x-envelope.
x-envelope: ../schema/envelope.json#/$defs/ApiEnvelope
paths:
  /api/v2/remote/sync-settings:
    get:
      operationId: getSyncSettingsV2
      security: &id001
      - localSession: []
      description: Computer-owned persisted sync setting; missing configuration initializes mirrorEnabled=true.
        Visibility never disables upload.
      responses:
        '200':
          description: 'ApiEnvelope.data; Cache-Control: no-store.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-sync.json#/$defs/RemoteSyncSettingsView
    put:
      operationId: setSyncSettingsV2
      security: *id001
      description: Same manager for v1/v2. expectedVersion CAS, Idempotency-Key replay. Persist setting and reset/tombstone
        intent atomically; do not claim server deletion is already confirmed. Disabling deletes store copies
        when reset is delivered.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote-sync.json#/$defs/RemoteSyncSettingsInput
      responses:
        '200':
          description: 'ApiEnvelope.data; Cache-Control: no-store.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-sync.json#/$defs/RemoteSyncSettingsView
        default:
          description: Existing ApiEnvelope error; no-store.
  /api/v2/remote/link:
    get:
      operationId: getLocalRemoteLink
      summary: 读取本机远程绑定与连接状态
      description: 只读本机状态，不启动模型或泄露设备凭据。沿用本机localSession Cookie、Host/Origin规则。 本机Local Hub API；云端Cookie不能用于此接口。所有成功及错误响应均Cache-Control:no-store。
        允许工作台轮询当前快照，不依赖WebSocket订阅；读取不产生配对副作用。
      responses:
        '200':
          description: ApiEnvelope.data为RemoteLinkView；Cache-Control:no-store。
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-link.json#/$defs/RemoteLinkView
          headers:
            Cache-Control:
              description: All success and error responses must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '403':
          $ref: '#/components/responses/LocalRemoteLinkError'
        default:
          $ref: '#/components/responses/LocalRemoteLinkError'
      security:
      - localSession: []
  /api/v2/remote/pairing:
    post:
      operationId: startLocalRemotePairing
      summary: 在本机发起远程设备配对
      description: |-
        输入仅serverOrigin/deviceName，由Worker内部生成和保存设备secret。
        只有取得有效服务端短码才返回state=pairing。已在配对时不同请求返回REMOTE_PAIRING_IN_PROGRESS，
        paired/revoked/frozen须先显式unlink，返回REMOTE_PAIRING_CONFLICT，不覆盖旧凭据。
        serverOrigin校验失败为REMOTE_SERVER_ORIGIN_INVALID；服务端无法连接/响应未确认为REMOTE_SERVER_UNREACHABLE。
        幂等重放不新建secret/请求、不续期短码；所有写入沿用v2 Cookie鉴权及Host/Origin规则。
         本机Local Hub API；云端Cookie不能用于此接口。所有成功及错误响应均Cache-Control:no-store。 浏览器写请求必须使用可信Origin与Idempotency-Key；复用本机v2幂等规则。
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Origin
        in: header
        required: true
        description: Browser writes use the existing local v2 trusted Origin validation.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote-link.json#/$defs/RemoteLinkPairingInput
      responses:
        '200':
          description: ApiEnvelope.data为RemoteLinkView，成功发起时state=pairing；Cache-Control:no-store。
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-link.json#/$defs/RemoteLinkView
          headers:
            Cache-Control:
              description: All success and error responses must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '403':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '409':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '422':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '503':
          $ref: '#/components/responses/LocalRemoteLinkError'
        default:
          $ref: '#/components/responses/LocalRemoteLinkError'
      security:
      - localSession: []
    delete:
      operationId: cancelLocalRemotePairing
      summary: 取消本机进行中的配对
      description: |-
        取消当前候选配对、轮询和候选凭据，成功返回unpaired。已经unpaired时幂等成功；
        已paired/revoked/frozen不得当作取消配对，须调用unlink，否则REMOTE_PAIRING_CONFLICT。
        取消前已发送的服务端请求可能仍生效，迟到结果不得复活本机绑定；未通知成功不宣称服务端也已撤销。
         本机Local Hub API；云端Cookie不能用于此接口。所有成功及错误响应均Cache-Control:no-store。 浏览器写请求必须使用可信Origin与Idempotency-Key；复用本机v2幂等规则。
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Origin
        in: header
        required: true
        description: Browser writes use the existing local v2 trusted Origin validation.
        schema:
          type: string
      responses:
        '200':
          description: ApiEnvelope.data为RemoteLinkView，state=unpaired；不再返回短码。
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-link.json#/$defs/RemoteLinkView
          headers:
            Cache-Control:
              description: All success and error responses must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '403':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '409':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '422':
          $ref: '#/components/responses/LocalRemoteLinkError'
        default:
          $ref: '#/components/responses/LocalRemoteLinkError'
      security:
      - localSession: []
  /api/v2/remote/unlink:
    post:
      operationId: unlinkLocalRemote
      summary: 本机删除远程设备凭据并断开绑定
      description: |-
        完成本机断开和凭据删除后才返回state=unpaired，通知服务端撤销为best-effort，不能冒充服务端已确认。
        不把设备Bearer当浏览器Cookie调用远程owner撤销接口；缺乏可用授权通知途径或离线也不阻塞本机解绑，
        可通过unpaired.lastErrorCode报告REMOTE_AUTH_REQUIRED或REMOTE_SERVER_UNREACHABLE。
        凭据删除失败不得返回成功。既有remote对话authority保留历史来源，本机可继续，不自动重放消息。
        本操作不承诺取消已在运行的任务。所有写操作使用v2既有Cookie鉴权，不新增凭据。
         本机Local Hub API；云端Cookie不能用于此接口。所有成功及错误响应均Cache-Control:no-store。 浏览器写请求必须使用可信Origin与Idempotency-Key；复用本机v2幂等规则。
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Origin
        in: header
        required: true
        description: Browser writes use the existing local v2 trusted Origin validation.
        schema:
          type: string
      responses:
        '200':
          description: ApiEnvelope.data为RemoteLinkView，state=unpaired；仅保证本机已断开并清理凭据。
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-link.json#/$defs/RemoteLinkView
          headers:
            Cache-Control:
              description: All success and error responses must not be stored.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '403':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '409':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '422':
          $ref: '#/components/responses/LocalRemoteLinkError'
        '500':
          $ref: '#/components/responses/LocalRemoteLinkError'
        default:
          $ref: '#/components/responses/LocalRemoteLinkError'
      security:
      - localSession: []
  /api/v2/role-templates/{templateId}:
    put:
      operationId: updateLocalRoleTemplate
      description: Update a role template name and instructions; base role is immutable. expectedVersion mismatch is CONFLICT. Existing scene copies and run snapshots are unchanged. Writes require Idempotency-Key and do not execute a model.
      security:
      - localSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/UpdateLocalRoleTemplateInput
      responses:
        '200':
          description: Saved role template; identical idempotency replay returns the original receipt.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRoleTemplateView
  /api/v2/role-templates:
    get:
      operationId: listLocalRoleTemplates
      security:
      - localSession: []
      responses:
        '200':
          description: Persisted custom role templates.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalRoleTemplateView
    post:
      operationId: createLocalRoleTemplate
      description: Create a reusable role template from one builtin base role. The template does not define or elevate permissions. Writes require Idempotency-Key and do not execute a model.
      security:
      - localSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/CreateLocalRoleTemplateInput
      responses:
        '201':
          description: Saved role template; identical idempotency replay returns the original receipt.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRoleTemplateView
  /internal/auth/connection-code:
    post:
      operationId: renewLocalConnectionCode
      description: Local operator only. Issues a one-use browser code without restarting the Worker or invalidating existing browser sessions. Cookie authentication is not accepted. Never returns the operator bearer.
      security:
      - hubOperator: []
      responses:
        '200':
          description: Pairing code with relative expiry, Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConnectionCodeView
  /api/v2/workspaces/pick:
    post:
      operationId: pickLocalDirectory
      description: Opens one native folder dialog on the Worker computer. Only selects an existing directory; registration is a separate explicit operation. Cancellation returns cancelled=true. Concurrent requests return CONFLICT; unavailable desktop or timeout returns FEATURE_UNAVAILABLE.
      security:
      - localSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/PickLocalDirectoryInput
      responses:
        '200':
          description: Selected absolute path, or normal user cancellation.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/PickLocalDirectoryView
  /api/v2/auth/local-session:
    post:
      operationId: openLocalSession
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAuthView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/LocalAuthInput
      parameters: []
  /api/v2/auth/status:
    get:
      operationId: getLocalAuthStatus
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAuthView
      parameters: []
  /api/v2/auth/logout:
    post:
      operationId: logoutLocalSession
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAuthView
      parameters: []
      security:
      - localSession: []
  /api/v2/scenes:
    post:
      operationId: createLocalScene
      description: Creates a custom scene with server-generated ID and derived readOnly. One to four unique builtin execution roles, at least one enabled, in execution order. original_planner requires enabled planner then developer then reviewer and inherits planner runtime/model/effort for acceptance. Template references are copied provenance; template changes never silently mutate scenes or frozen runs. Requires a matching template baseRoleId and a positive source revision no newer than the saved template.
      security:
      - localSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/CreateLocalSceneInput
      responses:
        '201':
          description: Created custom scene; repeated identical key returns original receipt.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalSceneView
    get:
      operationId: listLocalScenes
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalSceneView
      parameters: []
      security:
      - localSession: []
  /api/v2/scenes/{sceneId}:
    put:
      operationId: saveLocalScene
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalSceneView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/SaveLocalSceneInput
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/conversations:
    get:
      operationId: listLocalConversations
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error envelope is shared with
            v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalConversationView
      parameters:
      - name: includeHidden
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
      security:
      - localSession: []
      description: Computer list excludes mobile_only by default. includeHidden=true recovers hidden rows for
        editing; visibility is display-only. authority is not a write gate; busy is derived from actual kernel
        state.
    post:
      operationId: createLocalConversation
      responses:
        '201':
          description: ApiEnvelope.data contains the declared payload; success/error envelope is shared with
            v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConversationView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/CreateLocalConversationInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/conversations/{conversationId}:
    patch:
      operationId: updateLocalConversation
      description: Worker-owned conversation metadata; title/archived/visibility with expectedVersion CAS and
        at least one mutation. Local and remote authority are both writable. Workspace/scene/session associations
        remain unchanged. Archive requires no queued/running/waiting_approval round; recovery-only rounds show
        warning, not a busy lock.
      security:
      - localSession: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/UpdateLocalConversationInput
      responses:
        '200':
          description: Updated conversation; version increments for a successful metadata edit. lastRunStatus
            reflects latest actual run/task state and is absent if no runs exist.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConversationView
        '409':
          description: Version mismatch or conversation has unfinished work; ApiEnvelope error CONFLICT. Same
            key with different input yields IDEMPOTENCY_MISMATCH.
        '422':
          description: Empty patch, null field or invalid/blank title; ApiEnvelope error VALIDATION_FAILED.
  /api/v2/conversations/{conversationId}/messages:
    get:
      operationId: listLocalMessages
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalMessageView
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      security:
      - localSession: []
    post:
      operationId: sendLocalMessage
      responses:
        '202':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalMessageReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/SendLocalMessageInput
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/conversations/{conversationId}/runs:
    get:
      operationId: listConversationRuns
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalRunView
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/runs/{runId}:
    get:
      operationId: getLocalRun
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRunView
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/events:
    get:
      operationId: listLocalEvents
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalEventPage
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      security:
      - localSession: []
  /api/v2/agents/{agentId}/models:
    get:
      operationId: getAgentModels
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAgentModelsView
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
