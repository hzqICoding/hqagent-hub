                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote-link.json#/$defs/RemoteLinkView
          headers:
            Cache-Control:
              description: All success and error responses must not be stored.
              schema:
                type: string
                const: no-store
        '401':
