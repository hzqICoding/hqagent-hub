openapi: 3.1.0
info:
  title: HQAgent N0 Local Chat
  version: 0.11.1
  description: N0 additive contract. Responses use the existing ApiEnvelope; response
    schema below describes data, see x-envelope.
x-envelope: ../schema/envelope.json#/$defs/ApiEnvelope
paths:
  /api/v2/agents/image-verifications:
    get:
      operationId: listImageVerificationStatesV2
      summary: listImageVerificationStates
      description: 本机只读实例×模型验证矩阵：默认模型（省略modelId）和场景真实执行解析使用的模型；agentId+modelId可显式查询额外命名模型，modelId过滤必须带agentId。includeInactiveModels包含不再被场景使用的旧记录。无模型调用或收费。默认50/最多100，游标绑定筛选及快照；模型未指定表示不过滤而不是把字符串null当默认。
        仅本机现有鉴权/Host/Origin边界，无云端或PAT入口；所有成功/错误/重放no-store。详见R1.6-contract的0.10.1节。
      security:
      - localSession: []
      parameters:
      - name: agentId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 160
      - name: modelId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9][A-Za-z0-9._+\[\]-]*(?:[/:][A-Za-z0-9][A-Za-z0-9._+\[\]-]*)*$
          description: Exact model selector; reject URLs, filesystem paths, dot/dot-dot segments or credentials. Omitted modelId selects
            CLI default, not an invented model name.
      - name: includeInactiveModels
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 4096
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: X-HQ-Client-Features
        in: header
        required: false
        schema:
          type: string
          enum:
          - pi-v1
        description: Opt in to PI enum values and safe optional Runtime fields. Missing header retains the 0.10.1 projection. Bind this feature set to cursors and WS tickets; never grants authorization.
      responses:
        '200':
          description: ApiEnvelope.data; no model output or path.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          x-dataSchema:
            $ref: ../schema/local-maintenance.json#/$defs/LocalImageVerificationPage
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                      - target:
                          agentId: local.claude.default
                          agentType: claude
                          cliVersion: 1.2.3
                          transport: stream-json-image-v1
                          targetRevision: opaque-default-revision-001
                        inUse: false
                        usages: []
                        usagesTruncated: false
                        status: unverified
                        passed: false
                        invalidated: false
                        invalidationReasons: []
                      - target:
                          agentId: local.claude.default
                          agentType: claude
                          modelId: opus
                          cliVersion: 1.2.3
                          transport: stream-json-image-v1
                          targetRevision: opaque-target-revision-001
                        inUse: true
                        usages:
                        - sceneId: analyze
                          roleId: analyst
                        usagesTruncated: false
                        status: failed
                        passed: false
                        invalidated: false
                        invalidationReasons: []
                        lastRecord:
                          recordId: verification_record_example
                          target:
                            agentId: local.claude.default
                            agentType: claude
                            modelId: opus
                            cliVersion: 1.2.3
                            transport: stream-json-image-v1
                            targetRevision: opaque-target-revision-001
                          passed: false
                          probes:
                            new: false
                            resume: false
                            mixedFive: false
                            cancel: false
                            error: false
                          diagnostics:
                            newStart:
                              result: adapter_failure
                              elapsedMs: 12
                              code: INTERNAL
                              retryable: false
                              startupStage: process.start
                          mimeTypes: []
                          observedAt: '2026-10-02T12:00:00Z'
                          jobId: verification_job_example
                        lastJobId: verification_job_example
                      hasMore: false
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '401':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: 缺少或错误的 Bearer token；token 只能来自 hub.json
                      retryable: false
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '403':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                ORIGIN_NOT_ALLOWED:
                  value:
                    success: false
                    error:
                      code: ORIGIN_NOT_ALLOWED
                      message: Host 或 Origin 不在白名单。与 UNAUTHORIZED 区分开：那条是「没带对 token」， 这条是「token 对但来源不对」。混用会让排障时分不清是凭据问题还是来源问题。
                        HTTP 与 WebSocket 两种传输必须用同一语义，WS 侧以关闭码 4403 表达。
                      retryable: false
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '404':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                NOT_FOUND:
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: 目标资源不存在
                      retryable: false
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '422':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                VALIDATION_FAILED:
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: 请求体通过了格式检查但违反业务约束，detail 里给字段级原因
                      retryable: false
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '500':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                INTERNAL:
                  value:
                    success: false
                    error:
                      code: INTERNAL
                      message: 未分类的内部错误，detail 里带 requestId 供查日志
                      retryable: true
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '400':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                REMOTE_CURSOR_INVALID:
                  value:
                    success: false
                    error:
                      code: REMOTE_CURSOR_INVALID
                      message: 游标无效或与当前资源/认证范围不符，不泄露游标归属
                      retryable: false
                    requestId: req_maintenance_example
                    protocolVersion: 0.11.1
        '410':
          description: ApiEnvelope.error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-Id:
              schema:
                type: string
              example: req_maintenance_example
          content:
            application/json:
