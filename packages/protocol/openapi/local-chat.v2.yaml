components:
  responses:
    LocalRemoteLinkError:
      description: Existing ApiEnvelope error and registered error codes; local Cookie authentication, Origin and
        idempotency rules apply. No response is cacheable.
      content:
        application/json:
          schema:
            $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      headers:
        Cache-Control:
          description: All success and error responses must not be stored.
          schema:
            type: string
            const: no-store
  securitySchemes:
    hubOperator:
      type: http
      scheme: bearer
      description: Private local operator credential read from the runtime descriptor; never sent to the browser.
    localSession:
      type: apiKey
      in: cookie
      name: hqagent_local_session

x-pi-client-compatibility:
  feature: pi-v1
  header: X-HQ-Client-Features
  default: 0.10.1 projection; omit PI resources and new optional guard/model/format fields. Direct PI resource without opt-in
    returns existing NOT_FOUND, never relabels agentType.
  cursor: Bind negotiated feature set to list/event cursors and WS tickets. Reset snapshot on feature change; no cursor reuse
    between projections.
  authorization: Display/decoder capability only. No authentication, approval, runtime or billing privilege.
