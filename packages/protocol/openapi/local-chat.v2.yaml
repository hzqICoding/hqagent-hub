      security:
      - localSession: []
    delete:
      operationId: cancelLocalRemotePairing
      summary: 取消本机进行中的配对
      description: |-
        取消当前候选配对、轮询和候选凭据，成功返回unpaired。已经unpaired时幂等成功；
        已paired/revoked/frozen不得当作取消配对，须调用unlink，否则REMOTE_PAIRING_CONFLICT。
        取消前已发送的服务端请求可能仍生效，迟到结果不得复活本机绑定；未通知成功不宣称服务端也已撤销。
         本机Local Hub API；云端Cookie不能用于此接口。所有成功及错误响应均Cache-Control:no-store。 浏览器写请求必须使用可信Origin与Idempotency-Key；复用本机v2幂等规则。
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Origin
