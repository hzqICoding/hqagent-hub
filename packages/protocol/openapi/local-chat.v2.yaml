openapi: 3.1.0
info:
  title: HQAgent N0 Local Chat
  version: 0.5.0
  description: N0 additive contract. Responses use the existing ApiEnvelope; response
    schema below describes data, see x-envelope.
x-envelope: ../schema/envelope.json#/$defs/ApiEnvelope
paths:
  /api/v2/role-templates/{templateId}:
    put:
      operationId: updateLocalRoleTemplate
      description: Update a role template name and instructions; base role is immutable. expectedVersion mismatch is CONFLICT. Existing scene copies and run snapshots are unchanged. Writes require Idempotency-Key and do not execute a model.
      security:
      - localSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/UpdateLocalRoleTemplateInput
      responses:
        '200':
          description: Saved role template; identical idempotency replay returns the original receipt.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRoleTemplateView
  /api/v2/role-templates:
    get:
      operationId: listLocalRoleTemplates
      security:
      - localSession: []
      responses:
        '200':
          description: Persisted custom role templates.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalRoleTemplateView
    post:
      operationId: createLocalRoleTemplate
      description: Create a reusable role template from one builtin base role. The template does not define or elevate permissions. Writes require Idempotency-Key and do not execute a model.
      security:
      - localSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/CreateLocalRoleTemplateInput
      responses:
        '201':
          description: Saved role template; identical idempotency replay returns the original receipt.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRoleTemplateView
  /internal/auth/connection-code:
    post:
      operationId: renewLocalConnectionCode
      description: Local operator only. Issues a one-use browser code without restarting the Worker or invalidating existing browser sessions. Cookie authentication is not accepted. Never returns the operator bearer.
      security:
      - hubOperator: []
      responses:
        '200':
          description: Pairing code with relative expiry, Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConnectionCodeView
  /api/v2/workspaces/pick:
    post:
      operationId: pickLocalDirectory
      description: Opens one native folder dialog on the Worker computer. Only selects an existing directory; registration is a separate explicit operation. Cancellation returns cancelled=true. Concurrent requests return CONFLICT; unavailable desktop or timeout returns FEATURE_UNAVAILABLE.
      security:
      - localSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/PickLocalDirectoryInput
      responses:
        '200':
          description: Selected absolute path, or normal user cancellation.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/PickLocalDirectoryView
  /api/v2/auth/local-session:
    post:
      operationId: openLocalSession
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAuthView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/LocalAuthInput
      parameters: []
  /api/v2/auth/status:
    get:
      operationId: getLocalAuthStatus
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAuthView
      parameters: []
  /api/v2/auth/logout:
    post:
      operationId: logoutLocalSession
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAuthView
      parameters: []
      security:
      - localSession: []
  /api/v2/scenes:
    post:
      operationId: createLocalScene
      description: Creates a custom scene with server-generated ID and derived readOnly. One to four unique builtin execution roles, at least one enabled, in execution order. original_planner requires enabled planner then developer then reviewer and inherits planner runtime/model/effort for acceptance. Template references are copied provenance; template changes never silently mutate scenes or frozen runs. Requires a matching template baseRoleId and a positive source revision no newer than the saved template.
      security:
      - localSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/CreateLocalSceneInput
      responses:
        '201':
          description: Created custom scene; repeated identical key returns original receipt.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalSceneView
    get:
      operationId: listLocalScenes
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalSceneView
      parameters: []
      security:
      - localSession: []
  /api/v2/scenes/{sceneId}:
    put:
      operationId: saveLocalScene
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalSceneView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/SaveLocalSceneInput
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/conversations:
    get:
      operationId: listLocalConversations
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalConversationView
      parameters: []
      security:
      - localSession: []
    post:
      operationId: createLocalConversation
      responses:
        '201':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConversationView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/CreateLocalConversationInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/conversations/{conversationId}:
    patch:
      operationId: updateLocalConversation
      description: Rename or archive/restore a conversation with metadata version checking. At least one non-null title or archived field is required. Title is trimmed and must remain nonempty. Archiving is rejected while any run is queued, running, waiting_approval or paused; it never cancels work. Archived conversations remain readable but cannot accept messages or execution retry/resume until restored. Metadata edits preserve all task/session associations. List includes archived conversations; old clients may ignore optional fields. Matching Idempotency-Key replays the original response without incrementing revision again.
      security:
      - localSession: []
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/UpdateLocalConversationInput
      responses:
        '200':
          description: Updated conversation; version increments for a successful metadata edit. lastRunStatus reflects latest actual run/task state and is absent if no runs exist.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalConversationView
        '409':
          description: Version mismatch or conversation has unfinished work; ApiEnvelope error CONFLICT. Same key with different input yields IDEMPOTENCY_MISMATCH.
        '422':
          description: Empty patch, null field or invalid/blank title; ApiEnvelope error VALIDATION_FAILED.
  /api/v2/conversations/{conversationId}/messages:
    get:
      operationId: listLocalMessages
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalMessageView
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      security:
      - localSession: []
    post:
      operationId: sendLocalMessage
      responses:
        '202':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalMessageReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/local-chat.json#/$defs/SendLocalMessageInput
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/conversations/{conversationId}/runs:
    get:
      operationId: listConversationRuns
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/local-chat.json#/$defs/LocalRunView
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/runs/{runId}:
    get:
      operationId: getLocalRun
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRunView
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/events:
    get:
      operationId: listLocalEvents
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalEventPage
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      security:
      - localSession: []
  /api/v2/agents/{agentId}/models:
    get:
      operationId: getAgentModels
      responses:
        '200':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalAgentModelsView
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/runs/{runId}/commands:
    post:
      operationId: controlLocalRun
      responses:
        '202':
          description: ApiEnvelope.data contains the declared payload; success/error
            envelope is shared with v1.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/local-chat.json#/$defs/LocalRunView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/task.json#/$defs/TaskActionInput
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      security:
      - localSession: []
  /api/v2/agents:
    get:
      operationId: listLocalAgents
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/agent-instance.json#/$defs/AgentView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      parameters: []
  /api/v2/agents/discover:
    post:
      operationId: discoverLocalAgents
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            $ref: ../schema/agent-instance.json#/$defs/AgentDiscoveryResult
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      parameters: []
  /api/v2/workspaces:
    get:
      operationId: listLocalWorkspaces
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/workspace.json#/$defs/WorkspaceView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      parameters: []
    post:
      operationId: addLocalWorkspace
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            $ref: ../schema/workspace.json#/$defs/WorkspaceView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/workspace.json#/$defs/AddWorkspaceInput
      parameters: []
  /api/v2/approvals:
    get:
      operationId: listLocalApprovals
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/approval.json#/$defs/ApprovalView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      parameters: []
  /api/v2/approvals/{approvalId}/decisions:
    post:
      operationId: decideLocalApproval
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            $ref: ../schema/approval.json#/$defs/ApprovalView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/approval.json#/$defs/ApprovalResponseInput
      parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
  /api/v2/sessions:
    get:
      operationId: listLocalSessions
      security:
      - localSession: []
      responses:
        '200':
          description: ApiEnvelope; x-dataSchema defines data.
          x-dataSchema:
            type: array
            items:
              $ref: ../schema/session.json#/$defs/SessionView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
      parameters: []
  /api/v2/bootstrap:
    get:
      operationId: getLocalBootstrap
      security:
      - localSession: []
      responses:
        '200':
          description: Existing BootstrapView through cookie-authenticated local v2.
          x-dataSchema:
            $ref: ../schema/bootstrap.json#/$defs/BootstrapView
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
components:
  securitySchemes:
    hubOperator:
      type: http
      scheme: bearer
      description: Private local operator credential read from the runtime descriptor; never sent to the browser.
    localSession:
      type: apiKey
      in: cookie
      name: hqagent_local_session
