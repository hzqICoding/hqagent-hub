openapi: 3.1.0
info:
  title: HQAgent R1 Remote Communication
  version: 0.7.0
  description: Remote HTTPS origin only. Owner derives from authenticated session, never request parameters. D40/D41
    map current execution core. No model invocation/credentials, native history, attachments or signed approvals.
servers:
- url: https://{hubHost}
  variables:
    hubHost:
      default: hub.example.invalid
x-envelope: ../schema/envelope.json#/$defs/ApiEnvelope
paths:
  /api/v2/auth/login:
    post:
      operationId: remoteLogin
      description: Validate account password with rate limits and same-origin Origin checks; set HttpOnly Secure
        cookie. Same login intent must not create duplicate sessions. Authentication headers/response handling uses
        dedicated secure auth storage, never command response_json logs. Account provisioning is out-of-band operator
        bootstrap; no public registration or model subscription API.
      security: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteAuthenticatedSession
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemoteLoginInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
  /api/v2/auth/session:
    get:
      operationId: getRemoteSession
      description: Current browser session or authenticated=false. Cache-Control:no-store. No owner selector.
      security: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteBrowserSessionView
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
  /api/v2/auth/logout:
    post:
      operationId: remoteLogout
      description: Invalidate current session and clear cookie; never select another account/session in body.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteAnonymousSession
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
  /api/v2/worker/pairing-requests:
    post:
      operationId: requestRemotePairing
      description: 'Bootstrap exception: unknown high-entropy device bearer registers ONLY an unclaimed short-lived
        authentication challenge, never a usable device. Persist credential verifier, not secret. Rate limit and
        require TLS; Idempotency-Key bound to verifier. Once paired a credential cannot be registered/reassigned
        again.'
      security:
      - workerDevice: []
      responses:
        '201':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemotePairingChallenge
        default:
