          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
  /api/v2/events:
    get:
      operationId: listRemoteEvents
      description: Owner-wide events with independent opaque serverCursor; no numeric Worker seq resume. Missing
        after returns current tail and empty items; first load selected conversation snapshot then replay after
        its cursor. Expired cursor => REMOTE_CURSOR_EXPIRED410, never silently reset.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteBrowserEventPage
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
  /api/v2/conversations/{conversationId}/snapshot:
    get:
      operationId: getRemoteConversationSnapshot
      description: Transactionally consistent selected-conversation projection and stream cursor. Fetch more bounded
        history when hasMore=true, then apply subsequent events by cursor. Event endpoint may be polled; browser
        websocket streaming is not required by R1-P0.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteConversationSnapshot
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    remoteSession:
      type: apiKey
      in: cookie
      name: __Host-hqremote
      description: HttpOnly; Secure; SameSite=Strict; Path=/; no Domain; rotate on authentication; no session credential
        in JSON.
    workerDevice:
      type: http
      scheme: bearer
      description: Worker-generated independent device secret, at least 256 bits. TLS headers only; server stores
        only verification material, never plaintext or reversible secret. Browser never receives it.
x-worker-websocket:
  path: /ws/v2/worker
  security:
  - workerDevice: []
  clientFrames: ../schema/remote.json#/$defs/RemoteWorkerOutboundFrame
  serverFrames: ../schema/remote.json#/$defs/RemoteServerOutboundFrame
  maxFrameBytes: 262144
  description: Device paired and unrevoked before upgrade; first frame hello within 10s; no query-token fallback.
    15s heartbeats/45s offline. One active connection per worker; authenticated new epoch fences old connection.
    Events retain original epoch on retransmit; session heartbeats must match current epoch.
