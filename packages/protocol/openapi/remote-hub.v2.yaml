    get:
      operationId: listRemoteMessages
      description: Newest complete messages first by Worker messageSequence DESC, limit<=100. before is an exclusive
        opaque signed cursor pinned to owner/worker/store/conversation and snapshot cut. No before means latest
        page. New arrivals merge by messageId/messageRevision, sorted by messageSequence; never shift offset
        or reuse before across conversations. pc_only returns NOT_FOUND; incomplete segments are never visible.
      security:
      - remoteSession: []
      responses:
