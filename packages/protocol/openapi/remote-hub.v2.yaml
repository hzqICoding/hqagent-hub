  /api/v2/conversations:
    get:
      operationId: listRemoteConversations
      description: ' R1.5: hide pc_only in all reads, events and referenced resources (NOT_FOUND); no authority
        write gate. See R1.5-contract.md. Select workerId before browsing projects. New clients require workerId;
