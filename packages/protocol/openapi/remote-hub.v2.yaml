components:
  securitySchemes:
    remoteSession:
      type: apiKey
      in: cookie
      name: __Host-hqremote
      description: HttpOnly; Secure; SameSite=Strict; Path=/; no Domain; rotate on authentication; no session credential in
        JSON.
    workerDevice:
      type: http
      scheme: bearer
      description: Worker-generated independent device secret, at least 256 bits. TLS headers only; server stores only verification
        material, never plaintext or reversible secret. Browser never receives it.
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: hqr_pat_<24hex>_<43base64url>
      description: 账号级API令牌；本轮仅白名单设备路由。权限由每个operation的x-required-pat-scopes指定；scope独立且不通配。不能用于WSS、Worker配对、Cookie会话或令牌管理。
  schemas:
    PublishedOpenApiDocument:
      type: object
      required:
      - openapi
      - info
      - paths
      properties:
        openapi:
          type: string
          const: 3.1.0
        info:
          type: object
        paths:
          type: object
        components:
          type: object
      additionalProperties: true
x-worker-websocket:
  path: /ws/v2/worker
  security:
  - workerDevice: []
  clientFrames: ../schema/remote.json#/$defs/RemoteWorkerOutboundFrame
  serverFrames: ../schema/remote.json#/$defs/RemoteServerOutboundFrame
  maxFrameBytes: 262144
  description: 配对设备凭据握手；Cookie/PAT禁止。首帧hello在10秒内，15秒心跳/45秒失联。支持[1,2,3,4]，新R3操作仅修订3；双向升级栅栏、256KiB帧及临时查询见R3-contract.md。protocolVersion仅诊断。
    R1.6 supports [1,2,3,4]; revision4 carries bounded attachment manifests only, bytes use streaming HTTPS. Unconfirmed control
    attempts are terminal for upgrade fencing, not proof execution stopped. PI supports [1,2,3,4,5]; PI data requires revision 5 and its upgrade barrier.
  revisions:
    1:
      clientFrames: ../schema/remote.json#/$defs/RemoteWorkerOutboundFrame
      serverFrames: ../schema/remote.json#/$defs/RemoteServerOutboundFrame
    2:
      clientFrames: ../schema/remote-sync.json#/$defs/RemoteV2WorkerOutboundFrame
      serverFrames: ../schema/remote-sync.json#/$defs/RemoteV2ServerOutboundFrame
    3:
      clientFrames: ../schema/remote-native.json#/$defs/RemoteV3WorkerOutboundFrame
      serverFrames: ../schema/remote-native.json#/$defs/RemoteV3ServerOutboundFrame
    4:
      clientFrames: ../schema/remote-attachments.json#/$defs/RemoteV4WorkerOutboundFrame
      serverFrames: ../schema/remote-attachments.json#/$defs/RemoteV4ServerOutboundFrame
    5:
      clientFrames: ../schema/remote-pi.json#/$defs/RemoteV5WorkerOutboundFrame
      serverFrames: ../schema/remote-pi.json#/$defs/RemoteV5ServerOutboundFrame
x-static-surface:
  path: / (configured SPA assets)
  authentication: public; not an API resource
  response: HTML/assets, not ApiEnvelope; X-Request-Id best effort; operation=static; no request/response bodies in logs
x-idempotency-policy: 'Authenticate and authorize before replay. Device DELETE: first200, thereafter404 including same key.
  PAT issue: first201 secret, replay200 metadata only. Cookie-only token administration; no PAT privilege expansion. R3 directory-listings
  only metadata/digest deduplication, never cached response body; repeat rechecks authorization and queries Worker. Native
  import replay returns command metadata only, never terminal history.'

x-pi-client-compatibility:
  feature: pi-v1
  header: X-HQ-Client-Features
  default: 0.10.1 projection; omit PI resources and new optional guard/model/format fields. Direct PI resource without opt-in
    returns existing NOT_FOUND, never relabels agentType.
  cursor: Bind negotiated feature set to list/event cursors and WS tickets. Reset snapshot on feature change; no cursor reuse
    between projections.
  authorization: Display/decoder capability only. No authentication, approval, runtime or billing privilege.

x-browser-approval-projection:
  nonPi: ../schema/browser-pi.json#/$defs/RemoteBrowserLegacyApprovalEvent
  piOptIn: ../schema/browser-pi.json#/$defs/RemoteBrowserPiApprovalEvent
  contract: PI-contract.md section 8
  source: Worker facts remain immutable; browser projections never enter transport ACK/grant/hash processing.
  tickets: No cloud browser WS ticket route; local /api/v1/auth/ws-ticket belongs to Hub only.
