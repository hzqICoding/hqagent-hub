  /api/v2/devices/{workerId}/workspaces:
    post:
      security:
      - remoteSession: []
      x-auth-mode: cookie
      operationId: registerAuthorizedWorkspace
      summary: 选定已存在的文件夹，由电脑在grant之后重新解析真实路径并按本机规则登记；非Git目录允许登记为只读，不隐式mkdir或init-git
      description: 选定已存在的文件夹，由电脑在grant之后重新解析真实路径并按本机规则登记；非Git目录允许登记为只读，不隐式mkdir或init-git。202不是登记完成，catalog与command结果是权威。
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: request-example-001
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Cookie/登录写请求必须等于部署Origin；PAT请求不检查Origin。
        x-required-for-security:
        - remoteSession
        example: https://hub.example.invalid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
        description: Cookie写请求必须提供；PAT请求不需要，不能用此头给PAT扩权。
        x-required-for-security:
        - remoteSession
        example: csrf_example_0123456789abcdef0123456789
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      - *id007
      - name: X-HQ-Client-Features
        in: header
        required: false
        schema:
          type: string
          enum:
          - pi-v1
        description: Opt in to PI enum values and safe optional Runtime fields. Missing header retains the 0.10.1 projection. Bind this feature set to cursors and WS tickets; never grants authorization.
      x-error-codes:
      - BAD_REQUEST
      - CONFLICT
      - IDEMPOTENCY_MISMATCH
      - INTERNAL
      - NOT_FOUND
      - REMOTE_API_TOKEN_SCOPE_INSUFFICIENT
      - REMOTE_AUTH_AMBIGUOUS
      - REMOTE_AUTH_REQUIRED
      - REMOTE_CSRF_REJECTED
      - REMOTE_DELIVERY_EXPIRED
      - REMOTE_DEVICE_OFFLINE
      - REMOTE_DEVICE_REVOKED
      - REMOTE_DEVICE_SUSPENDED
      - REMOTE_DIRECTORY_CHANGED
      - REMOTE_PATH_OUTSIDE_ROOT
      - REMOTE_RATE_LIMITED
      - REMOTE_REVISION_REQUIRED
      - REMOTE_ROOT_NOT_AUTHORIZED
      - REMOTE_STORE_CHANGED
      - REMOTE_SYNC_DISABLED
      - VALIDATION_FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote-native.json#/$defs/RemoteWorkspaceRegisterInput
            examples:
              request:
                value:
                  rootId: synthetic_rootId
                  rootVersion: 1
                  directoryToken: opaque_synthetic_cursor_0001
                summary: 合成数据
