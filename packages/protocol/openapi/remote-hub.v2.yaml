      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemoteLoginInput
            examples:
              request:
                summary: 合成请求示例，不包含真实凭据
                value:
                  loginName: demo-user
                  password: example-only-not-a-real-password
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: request-example-001
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Cookie/登录写请求必须等于部署Origin；PAT请求不检查Origin。
        x-required-for-security:
        - remoteSession
        example: https://hub.example.invalid
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      x-auth-mode: public
      summary: remoteLogin
      x-error-codes:
      - BAD_REQUEST
      - IDEMPOTENCY_MISMATCH
      - INTERNAL
      - REMOTE_API_TOKEN_SCOPE_INSUFFICIENT
      - REMOTE_AUTH_AMBIGUOUS
      - REMOTE_AUTH_REQUIRED
      - REMOTE_CSRF_REJECTED
      - REMOTE_FRAME_TOO_LARGE
      - REMOTE_RATE_LIMITED
      - VALIDATION_FAILED
      x-request-example:
        method: POST
        path: /api/v2/auth/login
        headers:
          X-Client-Request-Id: 12345678-1234-4234-9234-123456789abc
          Idempotency-Key: request-example-001
          Origin: https://hub.example.invalid
        query: {}
        body:
          loginName: demo-user
          password: example-only-not-a-real-password
  /api/v2/auth/session:
    get:
      operationId: getRemoteSession
      description: Current browser session or authenticated=false. Cache-Control:no-store. No owner selector.
      security:
      - {}
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                success:
