  /api/v2/native-sessions/{nativeSessionId}/messages:
    get:
      security:
      - remoteSession: []
      x-auth-mode: cookie
      operationId: readNativeMessages
      summary: 在线按需读取规范化历史；只允许Cookie
      description: '在线按需读取规范化历史；只允许Cookie。10秒超时（固定），结果1MiB以内，分页可跨完整消息的分段；完整消息收齐前不展示。活跃会话可只读，暂停远程仍可读；删除/同步关闭后不得返回在途正文。 0.9.2:
        authentication and ownership first, deleted/missing device => NOT_FOUND before sync state. For an authorized device
        (detail/read require an owner-checked ID mapping), sync disabled => HTTP409 REMOTE_SYNC_DISABLED, even if offline;
        suspension does not block reads. Sync enabled and no sessions => empty list, unknown detail/read ID => NOT_FOUND.
        Never infer ownership from an unrecognized ID; retain only a non-content mapping for reset lookup.'
      parameters:
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      - *id001
      - *id002
      - name: before
        in: query
        required: false
        schema:
          type: string
        example: opaque_native_before_0001
      - name: X-HQ-Client-Features
        in: header
        required: false
        schema:
          type: string
          enum:
          - pi-v1
        description: Opt in to PI enum values and safe optional Runtime fields. Missing header retains the 0.10.1 projection. Bind this feature set to cursors and WS tickets; never grants authorization.
