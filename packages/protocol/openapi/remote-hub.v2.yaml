          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: workerId
        in: query
        required: false
        schema:
          type: string
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
    post:
      operationId: createRemoteConversation
      description: 'R1.5 online-only submission: offline immediately REMOTE_DEVICE_OFFLINE; revision 1 transport
        cannot implement this operation (REMOTE_REVISION_REQUIRED). Persist a bounded 30-second delivery attempt,
        not an offline queue. Worker is sole writer; explicit delivery grant before execution.  This is conversation.create
        on the computer; transport IDs may be reserved server-side but no authoritative conversation or user
        message is created on the server.'
      security:
      - remoteSession: []
      responses:
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign
            IDs, account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
        '202':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteQueuedReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemoteCreateConversationInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
