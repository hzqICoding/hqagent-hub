          minLength: 32
          maxLength: 256
  /api/v2/devices/{workerId}/catalog:
    get:
      operationId: getRemoteWorkerCatalog
      description: Last committed Worker catalog in current store; observedAt is not proof offline paths still exist.
        No catalog yet => REMOTE_DEVICE_OFFLINE or FEATURE_UNAVAILABLE, not fabricated directories. Directory browsing/registration
        beyond this indexed selection is not frozen here.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
