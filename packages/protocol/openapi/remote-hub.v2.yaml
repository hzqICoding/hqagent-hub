  /api/v2/auth/logout:
    post:
      operationId: remoteLogout
      description: Invalidate current session and clear cookie; never select another account/session in body.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                success:
                  summary: 合成成功示例
                  value:
                    success: true
                    data:
                      authenticated: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
