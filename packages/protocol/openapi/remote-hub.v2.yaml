        in: path
        required: true
        schema:
          type: string
  /api/v2/conversations/{conversationId}/messages:
    post:
      operationId: sendRemoteMessage
      description: Atomically store message + command + outbox and allocate one conversationSeq only for execution
        message. clientMessageId and Idempotency-Key both deduplicate within authenticated owner/conversation. Offline
        returns202 queued_offline, never running. Accepted commands do not expire mid-execution.
      security:
      - remoteSession: []
      responses:
        '202':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteQueuedReceipt
        default:
