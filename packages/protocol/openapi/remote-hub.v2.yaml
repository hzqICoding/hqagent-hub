          minLength: 16
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    post:
      operationId: createRemoteConversation
      description: Create remote conversation for owner-bound device/store and indexed workspace/scene, including
        while device is offline. Fixed target in R1; never replay imported local history as commands.
      security:
      - remoteSession: []
      responses:
        '201':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteConversationView
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemoteCreateConversationInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
