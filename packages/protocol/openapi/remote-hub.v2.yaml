  /api/v2/commands/{commandId}/cancellations:
    post:
      operationId: withdrawRemoteCommand
      description: 'Only for run.submit before a visible Run is bound. Never-dispatched: reject original command
        with REMOTE_COMMAND_WITHDRAWN and persist ordered skip in same transaction. Possibly dispatched: withdrawalState=requested
        plus an unsequenced command.withdraw; cannot mark confirmed before Worker reconciliation. A known Run must
        use cancel by runId. Race/unknown outcome stays pending, not success.'
      security:
      - remoteSession: []
      responses:
        '202':
          description: ApiEnvelope data; no raw authentication credential in JSON.
