            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemotePairingPreviewInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
  /api/v2/pairings/{pairRequestId}/confirm:
    post:
      operationId: confirmRemotePairing
      description: Consume unexpired one-use code and bind device to the CURRENT authenticated owner atomically.
        Code must match path request. Never accept owner/account identifier. Cross-user code replay reveals no owner.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteDeviceView
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemotePairingConfirmInput
      parameters:
      - name: pairRequestId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
  /api/v2/devices:
    get:
