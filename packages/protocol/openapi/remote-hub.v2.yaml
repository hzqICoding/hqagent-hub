              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                IDEMPOTENCY_MISMATCH:
                  summary: 幂等键已用于不同请求
                  value:
                    success: false
                    error:
                      code: IDEMPOTENCY_MISMATCH
                      message: 幂等键已用于不同请求
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.9.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '413':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
