                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                VALIDATION_FAILED:
                  summary: 请求参数不合法
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
