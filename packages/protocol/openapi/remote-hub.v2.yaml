                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                IDEMPOTENCY_MISMATCH:
                  summary: 幂等键已用于不同请求
                  value:
                    success: false
                    error:
                      code: IDEMPOTENCY_MISMATCH
                      message: 幂等键已用于不同请求
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '413':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                REMOTE_FRAME_TOO_LARGE:
                  summary: 远程帧超过256KiB，拒绝而不是截断关键内容后继续
                  value:
                    success: false
                    error:
                      code: REMOTE_FRAME_TOO_LARGE
                      message: 远程帧超过256KiB，拒绝而不是截断关键内容后继续
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '422':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
