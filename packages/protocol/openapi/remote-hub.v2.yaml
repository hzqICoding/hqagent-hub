            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      parameters:
      - name: pairRequestId
        in: path
        required: true
        schema:
          type: string
  /api/v2/pairings/preview:
    post:
      operationId: previewRemotePairing
      description: Resolve short code without consuming it; require logged-in browser and throttle guesses. Preview
        is not authorization to execute.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemotePairingPreview
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
