      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
