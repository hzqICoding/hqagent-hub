                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                REMOTE_API_TOKEN_SCOPE_INSUFFICIENT:
                  summary: API令牌权限不足或此接口不接受令牌
                  value:
                    success: false
                    error:
                      code: REMOTE_API_TOKEN_SCOPE_INSUFFICIENT
                      message: API令牌权限不足或此接口不接受令牌
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.9.1
                REMOTE_CSRF_REJECTED:
                  summary: 请求来源或CSRF校验失败
                  value:
                    success: false
                    error:
                      code: REMOTE_CSRF_REJECTED
                      message: 请求来源或CSRF校验失败
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.9.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '409':
          description: 按error.code处理，不解析中文message。
