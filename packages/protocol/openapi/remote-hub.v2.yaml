          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                INTERNAL:
                  summary: 服务内部错误，请稍后重试
                  value:
                    success: false
                    error:
                      code: INTERNAL
                      message: 服务内部错误，请稍后重试
                      retryable: true
