                  value:
                    success: true
                    data:
                      authenticated: true
                      account:
                        loginName: demo-user
                        displayName: Demo
                      expiresAt: '2026-09-26T12:05:00Z'
                      csrfToken: csrf_example_not_a_real_token_000000000000
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.9.1
                anonymous:
                  summary: 无有效Cookie时正常返回未登录
                  value:
                    success: true
                    data:
                      authenticated: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.9.1
          x-dataSchema:
