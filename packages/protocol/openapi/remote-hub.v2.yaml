      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Cookie写请求必须提供；PAT请求不需要，不能用此头给PAT扩权。 Cookie值须32..256字符；Bearer模式忽略此头及其值。
