            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      parameters:
      - name: workerId
        in: path
        required: true
        schema:
          type: string
  /api/v2/devices/{workerId}/revocations:
    post:
      operationId: revokeRemoteDevice
      description: Atomically revoke credential, fence connections and stop delivery; do not claim current local
        execution stopped. Owner-derived authorization required.
      security:
      - remoteSession: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteDeviceRevocationView
        default:
          description: ApiEnvelope error. Cross-owner/missing resources both NOT_FOUND; never include foreign IDs,
            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemoteDeviceRevokeInput
      parameters:
      - name: workerId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-CSRF-Token
        in: header
