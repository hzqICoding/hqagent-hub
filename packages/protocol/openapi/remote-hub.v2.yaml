            account identity or credentials in detail. Remote codes are registered in error-codes.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemotePairingRequestInput
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
  /api/v2/worker/pairing-requests/{pairRequestId}:
    get:
      operationId: getRemotePairingStatus
      description: Only the registering device credential can poll this request. Expired/revoked cannot connect
        as Worker.
      security:
      - workerDevice: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemotePairingStatusView
        default:
