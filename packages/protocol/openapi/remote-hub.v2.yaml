          Cookie: __Host-hqremote=<session-cookie>
        query:
          limit: 20
      x-ephemeral-result: true
      x-persist-response: false
      responses:
        '200':
          description: 在线按需响应，拼齐并校验后返回；仅内存，no-store，禁止通用幂等响应缓存、正文日志、Outbox或APM抓取。
