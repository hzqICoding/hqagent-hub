  /api/v2/conversations/{conversationId}/messages:
    post:
      operationId: sendRemoteMessage
      description: 'R1.5 online-only submission: offline immediately REMOTE_DEVICE_OFFLINE; revision 1 transport cannot implement
        this operation (REMOTE_REVISION_REQUIRED). Persist a bounded 30-second delivery attempt, not an offline queue. Worker
        is sole writer; explicit delivery grant before execution. Busy submission returns REMOTE_CONVERSATION_BUSY; controls/cancel/approval
        do not acquire a busy lock.  Imported native conversations require revision 3, sessionMode=continue and exact bound
