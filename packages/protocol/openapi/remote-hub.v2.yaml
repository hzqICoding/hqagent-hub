        '429':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              description: 至少等待的秒数；实际值由服务端限速窗口决定。
              schema:
                type: integer
                minimum: 1
              example: 60
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                REMOTE_RATE_LIMITED:
                  summary: 请求过于频繁，请稍后重试
                  value:
                    success: false
                    error:
                      code: REMOTE_RATE_LIMITED
                      message: 请求过于频繁，请稍后重试
                      retryable: true
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.9.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '500':
          description: 按error.code处理，不解析中文message。
