  /api/v2/approvals/{approvalId}/decisions:
    post:
      operationId: decideRemoteApproval
      description: R1 remote approve of git_push/deploy/delete/db_migrate or locally blocked actions => REMOTE_APPROVAL_FORBIDDEN403;
        no command enqueued. Worker repeats check from actual pending request and current local policy. Remote reject
        may be delivered without granting permission. A202 is not consumed approval.
      security:
      - remoteSession: []
      responses:
