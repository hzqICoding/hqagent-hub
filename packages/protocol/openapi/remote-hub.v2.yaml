                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                INTERNAL:
                  summary: 服务内部错误，请稍后重试
                  value:
                    success: false
                    error:
                      code: INTERNAL
                      message: 服务内部错误，请稍后重试
                      retryable: true
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/remote.json#/$defs/RemoteLoginInput
            examples:
              request:
                summary: 合成请求示例，不包含真实凭据
                value:
                  loginName: demo-user
                  password: example-only-not-a-real-password
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: request-example-001
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Cookie/登录写请求必须等于部署Origin；PAT请求不检查Origin。
        x-required-for-security:
        - remoteSession
        example: https://hub.example.invalid
      - name: X-Client-Request-Id
        in: header
        required: false
        description: 可选小写UUIDv4，仅关联日志，不替代服务端requestId；不回显原值到错误。
        schema:
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        example: 12345678-1234-4234-9234-123456789abc
      - name: X-HQ-Client-Features
        in: header
        required: false
        schema:
          type: string
          enum:
          - pi-v1
        description: Opt in to PI enum values and safe optional Runtime fields. Missing header retains the 0.10.1 projection. Bind this feature set to cursors and WS tickets; never grants authorization.
      x-auth-mode: public
      summary: remoteLogin
      x-error-codes:
      - BAD_REQUEST
      - IDEMPOTENCY_MISMATCH
      - INTERNAL
      - REMOTE_API_TOKEN_SCOPE_INSUFFICIENT
      - REMOTE_AUTH_AMBIGUOUS
      - REMOTE_AUTH_REQUIRED
      - REMOTE_CSRF_REJECTED
      - REMOTE_FRAME_TOO_LARGE
      - REMOTE_RATE_LIMITED
      - VALIDATION_FAILED
      x-request-example:
        method: POST
        path: /api/v2/auth/login
        headers:
          X-Client-Request-Id: 12345678-1234-4234-9234-123456789abc
          Idempotency-Key: request-example-001
          Origin: https://hub.example.invalid
        query: {}
        body:
          loginName: demo-user
          password: example-only-not-a-real-password
  /api/v2/auth/session:
    get:
