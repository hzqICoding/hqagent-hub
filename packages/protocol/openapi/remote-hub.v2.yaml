openapi: 3.1.0
info:
  title: HQAgent Hub Server HTTP API
  version: 0.11.1
  description: 部署于远程Hub Server的完整HTTP规范。设备管理支持Cookie或账号PAT；其它浏览器接口仍Cookie，Worker配对使用独立设备凭据。协议包0.8.0不改变wireRevision 1/2。完整约定见../remote/api-guide.md。
servers:
- url: https://{hubHost}
  variables:
    hubHost:
      default: hub.example.invalid
x-envelope: ../schema/envelope.json#/$defs/ApiEnvelope
paths:
  /api/v2/auth/login:
    post:
      operationId: remoteLogin
      description: Validate account password with rate limits and same-origin Origin checks; set HttpOnly Secure cookie. Same
        login intent must not create duplicate sessions. Authentication headers/response handling uses dedicated secure auth
        storage, never command response_json logs. Account provisioning is out-of-band operator bootstrap; no public registration
        or model subscription API.
      security: []
      responses:
        '200':
          description: ApiEnvelope data; no raw authentication credential in JSON.
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                success:
                  summary: 合成成功示例
                  value:
                    success: true
                    data:
                      authenticated: true
                      account:
                        loginName: demo-user
                        displayName: Demo
                      expiresAt: '2026-09-26T12:05:00Z'
                      csrfToken: csrf_example_not_a_real_token_000000000000
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-dataSchema:
            $ref: ../schema/remote.json#/$defs/RemoteAuthenticatedSession
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 登录设置HttpOnly/Secure/SameSite=Strict Cookie；退出清除Cookie。只通过响应头，不放进data。
              schema:
                type: string
        '400':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                BAD_REQUEST:
                  summary: 请求格式不合法
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: 请求格式不合法
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
                REMOTE_AUTH_AMBIGUOUS:
                  summary: 请求同时提供了多种身份凭据
                  value:
                    success: false
                    error:
                      code: REMOTE_AUTH_AMBIGUOUS
                      message: 请求同时提供了多种身份凭据
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '401':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                REMOTE_AUTH_REQUIRED:
                  summary: 请先登录
                  value:
                    success: false
                    error:
                      code: REMOTE_AUTH_REQUIRED
                      message: 请先登录
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '403':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
                type: string
                minLength: 16
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
              example: req_0123456789abcdef01234567
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schema/envelope.json#/$defs/ApiEnvelope
              examples:
                REMOTE_API_TOKEN_SCOPE_INSUFFICIENT:
                  summary: API令牌权限不足或此接口不接受令牌
                  value:
                    success: false
                    error:
                      code: REMOTE_API_TOKEN_SCOPE_INSUFFICIENT
                      message: API令牌权限不足或此接口不接受令牌
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
                REMOTE_CSRF_REJECTED:
                  summary: 请求来源或CSRF校验失败
                  value:
                    success: false
                    error:
                      code: REMOTE_CSRF_REJECTED
                      message: 请求来源或CSRF校验失败
                      retryable: false
                    requestId: req_0123456789abcdef01234567
                    protocolVersion: 0.11.1
          x-errorSchema:
            $ref: ../schema/remote-devices.json#/$defs/RemoteHttpError
        '409':
          description: 按error.code处理，不解析中文message。
          headers:
            X-Request-Id:
              description: 服务端为该请求生成；与信封requestId相同。
              schema:
