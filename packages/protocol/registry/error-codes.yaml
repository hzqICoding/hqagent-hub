# HQAgent-Hub 错误码注册表
#
# ApiEnvelope.error.code 只能取本表中的值。前端按 code 决定 UI 行为
# （例如 HUB_MAINTENANCE 显示全局维护 Gate），不得按 message 文本判断。
#
# retryable 是给调用方看的：true 表示同样的请求稍后重试有意义。
# 本文件由 scripts/generate.py 生成到三端的 ErrorCode 常量表。

version: 1

errors:
  # ---- 请求本身的问题 ----
  - code: BAD_REQUEST
    http: 400
    retryable: false
    description: 请求格式或参数不合法
  - code: VALIDATION_FAILED
    http: 422
    retryable: false
    description: 请求体通过了格式检查但违反业务约束，detail 里给字段级原因
  - code: UNAUTHORIZED
    http: 401
    retryable: false
    description: 缺少或错误的 Bearer token；token 只能来自 hub.json
  - code: ORIGIN_NOT_ALLOWED
    http: 403
    retryable: false
    description: >-
      Host 或 Origin 不在白名单。与 UNAUTHORIZED 区分开：那条是「没带对 token」，
      这条是「token 对但来源不对」。混用会让排障时分不清是凭据问题还是来源问题。
      HTTP 与 WebSocket 两种传输必须用同一语义，WS 侧以关闭码 4403 表达。
  - code: NOT_FOUND
    http: 404
    retryable: false
    description: 目标资源不存在
  - code: CONFLICT
    http: 409
    retryable: false
    description: 资源状态与请求冲突
  - code: IDEMPOTENCY_MISMATCH
    http: 409
    retryable: false
    description: 相同 Idempotency-Key 复用于不同请求体
  - code: PROTOCOL_VERSION_MISMATCH
    http: 426
    retryable: false
    description: 客户端协议大版本与 Hub 不兼容，必须升级后再试

  # ---- Hub 自身状态 ----
  - code: HUB_NOT_READY
    http: 503
    retryable: true
    description: Hub 正在启动或恢复中，尚未就绪
  - code: HUB_MAINTENANCE
    http: 503
    retryable: true
    description: Hub 处于维护/排空状态，拒绝创建新任务；前端据此显示全局 Gate
  - code: EVENT_CURSOR_EXPIRED
    http: 410
    retryable: false
    description: >-
      客户端携带的 seq 已超出事件保留窗口，无法补发。必须重新 bootstrap 拉取
      Snapshot 后再订阅，不允许静默丢事件继续跑
  - code: FEATURE_UNAVAILABLE
    http: 503
    retryable: true
    description: >-
      依赖的工作包尚未就绪（例如 Adapter 未接入、Update Agent 未运行）。
      必须返回明确原因，不允许用空成功伪装成功能可用

  # ---- Agent 与角色 ----
  - code: AGENT_NOT_FOUND
    http: 404
    retryable: false
    description: 指定的 Agent 实例不存在
  - code: AGENT_OFFLINE
    http: 409
    retryable: true
    description: Agent 当前离线，可等待或走 fallback
  - code: AGENT_NOT_LOGGED_IN
    http: 409
    retryable: false
    description: Agent 已安装但未登录，需要用户在对应工具里登录
  - code: AGENT_INCOMPATIBLE
    http: 409
    retryable: false
    description: Agent 版本低于适配器要求的最低版本
  - code: CAPABILITY_MISSING
    http: 409
    retryable: false
    description: 目标角色要求的硬能力在候选 Agent 上缺失，detail 里列能力缺口
  - code: ROLE_UNRESOLVED
    http: 409
    retryable: false
    description: 主选和备用链都无法解析出可用 Agent，需要用户选择或暂停节点

  # ---- 会话与任务 ----
  - code: SESSION_NOT_RESUMABLE
    http: 409
    retryable: false
    description: 外部会话已失效或适配器不支持恢复，只能新建会话
  - code: TASK_NOT_CANCELLABLE
    http: 409
    retryable: false
    description: 任务已处于终态，无法取消
  - code: TASK_ACTION_INVALID
    http: 409
    retryable: false
    description: 当前任务状态不支持该动作
  - code: WORKTREE_BUSY
    http: 409
    retryable: true
    description: 目标 worktree 被占用
  - code: PATH_NOT_ALLOWED
    http: 403
    retryable: false
    description: 修改路径超出任务 allowedPaths 或角色 writablePaths，detail 里列越界路径

  # ---- 审批 ----
  - code: APPROVAL_REQUIRED
    http: 409
    retryable: false
    description: 该动作需要审批且尚未批准
  - code: APPROVAL_EXPIRED
    http: 410
    retryable: false
    description: 审批已超时失效
  - code: APPROVAL_ALREADY_DECIDED
    http: 409
    retryable: false
    description: 该审批已被处理，不能重复决定

  # ---- 升级 ----
  - code: UPDATE_NOT_AVAILABLE
    http: 409
    retryable: false
    description: 当前没有可用更新
  - code: UPDATE_BUSY
    http: 409
    retryable: true
    description: 升级流程正在进行中，不接受新的升级动作
  - code: UPDATE_VERIFY_FAILED
    http: 422
    retryable: false
    description: 大小、SHA-256 或 Ed25519 签名校验失败；没有忽略并继续的入口
  - code: UPDATE_DRAIN_TIMEOUT
    http: 409
    retryable: true
    description: 任务排空超时，需要用户选择继续等待、取消任务或退出应用

  # ---- 兜底 ----
  - code: INTERNAL
    http: 500
    retryable: true
    description: 未分类的内部错误，detail 里带 requestId 供查日志

  # ---- R1 remote communication, 0.6.0 ----
  - code: REMOTE_AUTH_REQUIRED
    http: 401
    retryable: false
    description: 远程账号会话缺失或失效；与本机Hub Token鉴权分离
  - code: REMOTE_CSRF_REJECTED
    http: 403
    retryable: false
    description: 远程浏览器写请求的Origin或会话CSRF校验失败
  - code: REMOTE_DEVICE_OFFLINE
    http: 409
    retryable: true
    description: 目标设备离线；R1.5浏览器提交立即失败，不排队；修订1历史记录只读保留
  - code: REMOTE_DEVICE_REVOKED
    http: 403
    retryable: false
    description: 设备配对已撤销，禁止新连接与后续命令；不宣称已停止本机执行
  - code: REMOTE_DEVICE_AUTH_FAILED
    http: 401
    retryable: false
    description: 设备凭据验证失败；响应不区分其他所有者设备的存在性
  - code: REMOTE_PAIRING_EXPIRED
    http: 410
    retryable: false
    description: 一次性配对请求或配对码已过期
  - code: REMOTE_PAIRING_CONFLICT
    http: 409
    retryable: false
    description: 配对已消费或设备凭据已绑定；不得重新归属另一用户
  - code: REMOTE_PAIRING_INVALID
    http: 404
    retryable: false
    description: 无效配对码或请求；不泄露已绑定账号信息
  - code: REMOTE_COMMAND_EXPIRED
    http: 410
    retryable: false
    description: 命令接单前已过期，不再执行；已分配执行序号须留跳过记录
  - code: REMOTE_COMMAND_WITHDRAWN
    http: 409
    retryable: false
    description: 命令在未派发时撤回或经Worker核实撤回；拒绝迟到重复执行
  - code: REMOTE_WITHDRAWAL_UNCONFIRMED
    http: 409
    retryable: false
    description: 已可能派发，不能仅删服务端记录宣称撤回；须Worker核实
  - code: REMOTE_STORE_CHANGED
    http: 409
    retryable: false
    description: Worker存储世代变化，冻结旧世代未决命令自动投递等待对账
  - code: REMOTE_EPOCH_STALE
    http: 409
    retryable: false
    description: 非当前已认证连接或旧Worker启动实例的帧被拒绝
  - code: REMOTE_PROTOCOL_UNSUPPORTED
    http: 409
    retryable: false
    description: 协议版本不兼容；不静默降级远程命令语义
  - code: REMOTE_EVENT_CONFLICT
    http: 409
    retryable: false
    description: 同事件ID或存储世代序号/覆盖区间对应不同不可变内容
  - code: REMOTE_ACK_CONFLICT
    http: 409
    retryable: false
    description: 确认位置错误、跨存储世代或服务端确认回退，需要对账而非裁剪Outbox
  - code: REMOTE_SEQUENCE_GAP
    http: 409
    retryable: true
    description: 执行对话序号存在缺口，先补命令或跳过记录，控制命令不占执行序号
  - code: REMOTE_APPROVAL_FORBIDDEN
    http: 403
    retryable: false
    description: R1禁止远程批准此高风险或Worker策略禁止的动作；本机可处理
  - code: CONVERSATION_AUTHORITY_MISMATCH
    http: 409
    retryable: false
    description: 0.7起不再用于本机remote只读拦截；保留历史/真实归属冲突。原语义：本地写接口不能写remote对话，必须走权威服务端；旧local对话不自动转换
  - code: REMOTE_TARGET_MISMATCH
    http: 409
    retryable: false
    description: 命令目标、对话固定Worker或执行引用不匹配；跨owner资源统一NOT_FOUND
  - code: REMOTE_SCENE_VERSION_MISMATCH
    http: 409
    retryable: false
    description: Worker场景版本与已排队请求不一致，不静默换用最新角色配置
  - code: REMOTE_CURSOR_EXPIRED
    http: 410
    retryable: false
    description: 浏览器opaque游标已失效，需重新获取owner范围快照
  - code: REMOTE_CURSOR_INVALID
    http: 400
    retryable: false
    description: 游标无效或与当前资源/认证范围不符，不泄露游标归属
  - code: REMOTE_RATE_LIMITED
    http: 429
    retryable: true
    description: 远程登录/配对/提交限流，按Retry-After重试，不能绕过单次码或幂等规则
  - code: REMOTE_FRAME_TOO_LARGE
    http: 413
    retryable: false
    description: 远程帧超过256KiB，拒绝而不是截断关键内容后继续
  - code: REMOTE_WITHDRAWAL_TOO_LATE
    http: 409
    retryable: false
    description: 原提交已形成可见Run或已执行结束，不能声称撤回从未执行；已知Run应按runId控制

  # ---- FZ-R1.1 local pairing controls ----
  - code: REMOTE_PAIRING_IN_PROGRESS
    http: 409
    retryable: false
    description: 本机已有配对请求进行中；同幂等请求可重放，新请求须先取消旧配对
  - code: REMOTE_SERVER_UNREACHABLE
    http: 503
    retryable: true
    description: 配置的远程服务无法连接或响应未确认；不得伪造配对或服务端撤销成功
  - code: REMOTE_SERVER_ORIGIN_INVALID
    http: 422
    retryable: false
    description: serverOrigin不是允许的HTTPS origin，或未获本机开发模式允许的localhost/127.0.0.1 HTTP origin

  # R1.5 HTTP/revision 2 only; revision 1 uses its frozen enum.
  - code: REMOTE_CONVERSATION_BUSY
    http: 409
    retryable: true
    description: 电脑已有queued/running/waiting_approval轮次；保留输入，取消不受此限制
  - code: REMOTE_STATE_NOT_READY
    http: 409
    retryable: true
    description: 等待当前连接的完整忙碌快照；不是持久锁
  - code: REMOTE_SYNC_CONFLICT
    http: 409
    retryable: false
    description: 同步分段/版本/快照内容冲突，不得发布部分正文
  - code: REMOTE_SYNC_DISABLED
    http: 409
    retryable: false
    description: 该电脑关闭内容同步，不能向已删除副本提交
  - code: REMOTE_DELIVERY_EXPIRED
    http: 409
    retryable: true
    description: 送达期限已过且未获执行许可；设备离线，发送失败
  - code: REMOTE_REVISION_REQUIRED
    http: 409
    retryable: false
    description: 该操作要求线路修订2，不能降级执行
  - code: REMOTE_SYNC_RESOURCE_LIMIT
    http: 413
    retryable: false
    description: 全文同步资源配额不足，明确失败，不截断伪装成功
