errors:
  BAD_REQUEST:
    message: 请求格式不合法
    cause: 请求格式或参数不合法
    handling: 刷新或修正请求后使用新幂等键
    surface: Hub Server HTTP
  VALIDATION_FAILED:
    message: 请求参数不合法
    cause: 请求体通过了格式检查但违反业务约束，detail 里给字段级原因
    handling: 刷新或修正请求后使用新幂等键
    surface: Hub Server HTTP
  UNAUTHORIZED:
    message: 缺少或错误的 Bearer token
    cause: 缺少或错误的 Bearer token；token 只能来自 hub.json
    handling: 重新登录或更换正确凭据；不要盲目重试
    surface: 共享注册表；仅在所属子系统/Worker事实中出现，不表示每个HTTP接口都可返回
  ORIGIN_NOT_ALLOWED:
    message: Host 或 Origin 不在白名单
    cause: Host 或 Origin 不在白名单。与 UNAUTHORIZED 区分开：那条是「没带对 token」， 这条是「token 对但来源不对」。混用会让排障时分不清是凭据问题还是来源问题。
      HTTP 与 WebSocket 两种传输必须用同一语义，WS 侧以关闭码 4403 表达。
    handling: 检查授权范围和允许的操作
    surface: 共享注册表；仅在所属子系统/Worker事实中出现，不表示每个HTTP接口都可返回
  NOT_FOUND:
    message: 资源不存在
    cause: 目标资源不存在
    handling: 确认资源和账号；设备删除场景可视为已不存在
    surface: Hub Server HTTP
  CONFLICT:
    message: 资源版本或状态已变化，请刷新后重试
    cause: 资源状态与请求冲突
    handling: GET最新version，核对修改意图后以新expectedVersion和新幂等键提交
    surface: Hub Server HTTP
  IDEMPOTENCY_MISMATCH:
    message: 幂等键已用于不同请求
    cause: 相同 Idempotency-Key 复用于不同请求体
    handling: 不要更改重试请求体；新意图使用新幂等键
    surface: Hub Server HTTP
  PROTOCOL_VERSION_MISMATCH:
    message: 客户端协议大版本与 Hub 不兼容，必须升级后再试
    cause: 客户端协议大版本与 Hub 不兼容，必须升级后再试
    handling: 保留requestId，按retryable退避或联系管理员
    surface: 共享注册表；仅在所属子系统/Worker事实中出现，不表示每个HTTP接口都可返回
  HUB_NOT_READY:
    message: Hub 正在启动或恢复中，尚未就绪
    cause: Hub 正在启动或恢复中，尚未就绪
    handling: 保留requestId，按retryable退避或联系管理员
    surface: 共享注册表；仅在所属子系统/Worker事实中出现，不表示每个HTTP接口都可返回
