    cause: 客户端携带的 seq 已超出事件保留窗口，无法补发。必须重新 bootstrap 拉取 Snapshot 后再订阅，不允许静默丢事件继续跑
    handling: 重建快照或发起新请求
    surface: 共享注册表；仅在所属子系统/Worker事实中出现，不表示每个HTTP接口都可返回
