    cause: 已授权设备的当前store关闭内容同步；原生索引列表、详情、读取统一拒绝，不能以空页或NOT_FOUND冒充无会话
    handling: 在电脑开启同步并等待补传后刷新；不要自动重试或显示无会话
    surface: Hub Server HTTP
  REMOTE_DELIVERY_EXPIRED:
    message: 设备离线，发送失败
    cause: 送达期限已过且未获执行许可；设备离线，发送失败
    handling: 刷新或修正请求后使用新幂等键
    surface: Hub Server HTTP
  REMOTE_REVISION_REQUIRED:
    message: 电脑端需升级后使用此操作
    cause: 该操作要求较新的线路修订（R1.5为2，R3为3），不能降级执行
    handling: 刷新或修正请求后使用新幂等键
    surface: Hub Server HTTP
  REMOTE_SYNC_RESOURCE_LIMIT:
    message: 全文同步资源配额不足，明确失败，不截断伪装成功
    cause: 全文同步资源配额不足，明确失败，不截断伪装成功
    handling: 减小请求或检查资源配额；不得截断后伪装成功
    surface: Hub Server HTTP
  REMOTE_DEVICE_SUSPENDED:
    message: 这台电脑的远程操作已暂停
    cause: 这台电脑的远程操作已暂停
    handling: 先明确恢复远程操作；取消运行/拒绝审批仍可尝试
    surface: Hub Server HTTP
  REMOTE_API_TOKEN_INVALID:
    message: API令牌无效或已吊销
    cause: API令牌无效或已吊销
    handling: 核对令牌有效期、吊销状态和精确scope；Cookie管理页重签或调整调用路由
    surface: Hub Server HTTP
  REMOTE_API_TOKEN_EXPIRED:
    message: API令牌已过期
    cause: API令牌已过期
    handling: 核对令牌有效期、吊销状态和精确scope；Cookie管理页重签或调整调用路由
    surface: Hub Server HTTP
  REMOTE_API_TOKEN_SCOPE_INSUFFICIENT:
    message: API令牌权限不足或此接口不接受令牌
    cause: API令牌权限不足或此接口不接受令牌
    handling: 核对令牌有效期、吊销状态和精确scope；Cookie管理页重签或调整调用路由
    surface: Hub Server HTTP
  REMOTE_AUTH_AMBIGUOUS:
    message: 请求同时提供了多种身份凭据
    cause: 请求同时提供了多种身份凭据
    handling: 刷新或修正请求后使用新幂等键
    surface: Hub Server HTTP
  REMOTE_QUERY_TIMEOUT:
    message: 电脑在线查询超时
    cause: 电脑未在查询期限内返回完整结果
    handling: 保持输入并用新查询重试
    surface: R3 HTTP / Worker wireRevision 3 only
  REMOTE_QUERY_TOO_LARGE:
    message: 在线查询结果超过大小上限
    cause: 完整页超过1MiB或分段超限
    handling: 减小limit；不得显示不完整消息
    surface: R3 HTTP / Worker wireRevision 3 only
  NATIVE_SESSION_ACTIVE:
    message: 原生会话可能仍在终端运行
    cause: 存在活跃证据或未确认终端关闭
    handling: 关闭终端并重新确认；只读历史仍可用
    surface: R3 HTTP / Worker wireRevision 3 only
  NATIVE_SESSION_UNSUPPORTED:
    message: 无法读取该版本的原生会话
    cause: 无已验证读取插件或结构不符
    handling: 在电脑升级读取插件，不猜测解析
    surface: R3 HTTP / Worker wireRevision 3 only
  NATIVE_SESSION_CHANGED:
    message: 原生会话已变化，请刷新后确认
